<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nestfolio — Onboarding Conversation Wireframe</title>
  <style>
    :root {
      --primary: #1B6B4A;
      --primary-light: #E8F5EE;
      --primary-dark: #0F4A30;
      --accent: #2A9D6E;
      --neutral-50: #FAFBFC;
      --neutral-100: #F3F4F6;
      --neutral-200: #E5E7EB;
      --neutral-300: #D1D5DB;
      --neutral-400: #9CA3AF;
      --neutral-500: #6B7280;
      --neutral-600: #4B5563;
      --neutral-700: #374151;
      --neutral-800: #1F2937;
      --neutral-900: #111827;
      --positive: #059669;
      --cautionary: #D97706;
      --negative: #DC2626;
      --white: #FFFFFF;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: #E8ECF0;
      color: var(--neutral-800);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Phone Frame ── */
    .phone-frame {
      width: 390px;
      height: 844px;
      background: var(--neutral-50);
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── Status Bar ── */
    .status-bar {
      height: 54px;
      background: var(--white);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 8px;
      flex-shrink: 0;
    }
    .status-bar .time {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .status-bar .icons {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-bar .icons svg { width: 16px; height: 16px; }

    /* ── Navigation Header ── */
    .nav-header {
      height: 56px;
      background: var(--white);
      border-bottom: 1px solid var(--neutral-200);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
    }
    .nav-header .back-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--neutral-100);
      border-radius: var(--radius-full);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--neutral-600);
      transition: background 0.2s;
    }
    .nav-header .back-btn:hover { background: var(--neutral-200); }
    .nav-header .agent-info { flex: 1; display: flex; align-items: center; gap: 10px; }
    .nav-header .agent-avatar {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }
    .nav-header .agent-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--neutral-800);
    }
    .nav-header .agent-status {
      font-size: 12px;
      color: var(--positive);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav-header .agent-status::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--positive);
      border-radius: var(--radius-full);
      display: inline-block;
    }

    /* ── Progress Bar ── */
    .progress-container {
      background: var(--white);
      padding: 0 16px 12px;
      flex-shrink: 0;
    }
    .progress-bar-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-track {
      flex: 1;
      height: 4px;
      background: var(--neutral-200);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: var(--radius-full);
      transition: width 0.6s ease;
      width: 0%;
    }
    .progress-label {
      font-size: 12px;
      color: var(--neutral-400);
      white-space: nowrap;
      font-weight: 500;
    }

    /* ── Chat Area ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 0; }

    /* ── Messages ── */
    .message-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .message-group.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
    }

    /* Agent messages */
    .message.agent {
      align-self: flex-start;
      background: var(--white);
      color: var(--neutral-800);
      border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .message-group .message.agent:first-child {
      border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
    }
    .message-group .message.agent:only-child {
      border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
    }

    /* User messages */
    .message.user {
      align-self: flex-end;
      background: var(--primary);
      color: var(--white);
      border-radius: var(--radius-lg) 4px var(--radius-lg) var(--radius-lg);
    }

    .message strong { font-weight: 600; }
    .message em { font-style: italic; color: var(--neutral-500); }
    .message.agent em { color: var(--neutral-500); }
    .message.user em { color: rgba(255,255,255,0.75); }

    /* ── Option Cards ── */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 88%;
      align-self: flex-start;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .options-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .option-card {
      background: var(--white);
      border: 2px solid var(--neutral-200);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .option-card:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      box-shadow: var(--shadow-sm);
    }
    .option-card.selected {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .option-card .option-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--neutral-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .option-card.selected .option-icon {
      background: var(--primary);
      color: var(--white);
    }
    .option-card .option-text .option-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--neutral-800);
    }
    .option-card .option-text .option-desc {
      font-size: 13px;
      color: var(--neutral-500);
      margin-top: 2px;
    }

    /* ── Mode Cards (special 3-up) ── */
    .mode-cards-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 92%;
      align-self: flex-start;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .mode-cards-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .mode-card {
      background: var(--white);
      border: 2px solid var(--neutral-200);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-card:hover { border-color: var(--primary); }
    .mode-card.recommended { border-color: var(--accent); }
    .mode-card.selected {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .mode-card .mode-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      background: rgba(42, 157, 110, 0.1);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      margin-bottom: 6px;
    }
    .mode-card .mode-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--neutral-800);
      margin-bottom: 4px;
    }
    .mode-card .mode-subtitle {
      font-size: 13px;
      color: var(--neutral-600);
      margin-bottom: 8px;
    }
    .mode-card .mode-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .mode-card .mode-detail {
      font-size: 12px;
      color: var(--neutral-500);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mode-card .mode-detail::before {
      content: '';
      width: 4px;
      height: 4px;
      background: var(--neutral-300);
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }
    .mode-card.selected .mode-detail::before { background: var(--primary); }

    /* ── Slider Input ── */
    .slider-container {
      max-width: 88%;
      align-self: flex-start;
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .slider-container.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .slider-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--neutral-600);
      margin-bottom: 12px;
    }
    .slider-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      margin-bottom: 12px;
    }
    .slider-track {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary) 33%, var(--neutral-200) 33%);
      border-radius: var(--radius-full);
      outline: none;
    }
    .slider-track::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      background: var(--primary);
      border: 3px solid var(--white);
      box-shadow: var(--shadow-md);
      cursor: pointer;
    }
    .slider-range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: var(--neutral-400);
    }

    /* ── Amount Input ── */
    .amount-container {
      max-width: 88%;
      align-self: flex-start;
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .amount-container.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .amount-input-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 12px;
    }
    .amount-input-wrap .currency-symbol {
      font-size: 28px;
      font-weight: 600;
      color: var(--neutral-400);
    }
    .amount-input-wrap .amount-value {
      font-size: 36px;
      font-weight: 700;
      color: var(--primary);
      border: none;
      outline: none;
      width: 160px;
      text-align: center;
      background: transparent;
    }
    .amount-presets {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .amount-presets .preset-btn {
      padding: 6px 14px;
      border: 1.5px solid var(--neutral-200);
      border-radius: var(--radius-full);
      background: var(--white);
      font-size: 13px;
      font-weight: 500;
      color: var(--neutral-600);
      cursor: pointer;
      transition: all 0.2s;
    }
    .amount-presets .preset-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .amount-presets .preset-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    /* ── Consent Toggle ── */
    .consent-container {
      max-width: 88%;
      align-self: flex-start;
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .consent-container.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .consent-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .consent-toggle {
      width: 44px;
      height: 26px;
      border-radius: var(--radius-full);
      background: var(--neutral-300);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.3s;
      margin-top: 2px;
    }
    .consent-toggle.active { background: var(--primary); }
    .consent-toggle::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: var(--radius-full);
      background: var(--white);
      top: 3px;
      left: 3px;
      transition: left 0.3s;
      box-shadow: var(--shadow-sm);
    }
    .consent-toggle.active::after { left: 21px; }
    .consent-text {
      font-size: 14px;
      color: var(--neutral-600);
      line-height: 1.4;
    }
    .consent-text a {
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
    }

    /* ── Summary Card ── */
    .summary-card {
      max-width: 88%;
      align-self: flex-start;
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 20px 16px;
      box-shadow: var(--shadow-md);
      border-left: 4px solid var(--primary);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .summary-card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .summary-card .summary-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .summary-card .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--neutral-100);
    }
    .summary-card .summary-row:last-child { border-bottom: none; }
    .summary-card .summary-label {
      font-size: 13px;
      color: var(--neutral-500);
    }
    .summary-card .summary-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--neutral-800);
    }
    .summary-card .summary-value .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .summary-card .summary-value .badge.balanced {
      background: rgba(42,157,110,0.1);
      color: var(--accent);
    }

    /* ── Typing Indicator ── */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      background: var(--white);
      padding: 12px 18px;
      border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
      box-shadow: var(--shadow-sm);
      margin-bottom: 8px;
    }
    .typing-indicator.visible { display: flex; gap: 4px; align-items: center; }
    .typing-indicator .dot {
      width: 7px;
      height: 7px;
      background: var(--neutral-300);
      border-radius: var(--radius-full);
      animation: typing-bounce 1.4s ease-in-out infinite;
    }
    .typing-indicator .dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-indicator .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* ── CTA Button (inside chat) ── */
    .cta-button {
      max-width: 88%;
      align-self: flex-start;
      background: var(--primary);
      color: var(--white);
      border: none;
      padding: 14px 28px;
      border-radius: var(--radius-full);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease, background 0.2s ease;
    }
    .cta-button.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .cta-button:hover { background: var(--primary-dark); }

    /* ── Input Area ── */
    .input-area {
      background: var(--white);
      border-top: 1px solid var(--neutral-200);
      padding: 12px 16px;
      padding-bottom: 28px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }
    .input-area .input-wrapper {
      flex: 1;
      background: var(--neutral-100);
      border-radius: var(--radius-xl);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      min-height: 44px;
      border: 2px solid transparent;
      transition: border-color 0.2s, background 0.2s;
    }
    .input-area .input-wrapper:focus-within {
      border-color: var(--primary);
      background: var(--white);
    }
    .input-area .text-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      background: transparent;
      color: var(--neutral-800);
      resize: none;
      font-family: inherit;
      line-height: 1.4;
    }
    .input-area .text-input::placeholder { color: var(--neutral-400); }
    .input-area .send-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: var(--primary);
      border-radius: var(--radius-full);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .input-area .send-btn:hover { background: var(--primary-dark); transform: scale(1.05); }
    .input-area .send-btn:active { transform: scale(0.95); }
    .input-area .send-btn.disabled {
      background: var(--neutral-300);
      cursor: default;
      pointer-events: none;
    }

    /* ── Timestamp ── */
    .timestamp {
      text-align: center;
      font-size: 11px;
      color: var(--neutral-400);
      margin: 12px 0 8px;
      font-weight: 500;
    }

    /* ── Bottom Nav Bar ── */
    .bottom-nav {
      height: 0;
      overflow: hidden;
    }

    /* ── Completion Overlay ── */
    .completion-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.97);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 40px;
      text-align: center;
    }
    .completion-overlay.visible { display: flex; }
    .completion-icon {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(27,107,74,0.25);
    }
    .completion-icon svg { width: 40px; height: 40px; color: var(--white); }
    .completion-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--neutral-900);
      margin-bottom: 8px;
    }
    .completion-subtitle {
      font-size: 15px;
      color: var(--neutral-500);
      margin-bottom: 32px;
      max-width: 280px;
    }
    .completion-btn {
      background: var(--primary);
      color: var(--white);
      border: none;
      padding: 16px 40px;
      border-radius: var(--radius-full);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      transition: background 0.2s;
    }
    .completion-btn:hover { background: var(--primary-dark); }

    /* ── Utilities ── */
    .hidden { display: none !important; }
    .mb-4 { margin-bottom: 4px; }
    .mb-8 { margin-bottom: 8px; }
    .mb-12 { margin-bottom: 12px; }
  </style>
</head>
<body>

<div class="phone-frame">
  <!-- Status Bar -->
  <div class="status-bar">
    <div class="time">9:41</div>
    <div class="icons">

// ── Helpers ──
function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function scrollToBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  typingIndicator.classList.add('visible');
  chatArea.appendChild(typingIndicator);
  scrollToBottom();
}

function hideTyping() {
  typingIndicator.classList.remove('visible');
}

function updateProgress(step, percent) {
  progressFill.style.width = percent + '%';
  progressLabel.textContent = step + ' di 7';
}

function createMessageGroup() {
  const group = document.createElement('div');
  group.className = 'message-group';
  chatArea.appendChild(group);
  return group;
}

async function addAgentMessage(text, group) {
  showTyping();
  await delay(600 + Math.random() * 400);
  hideTyping();

  const msg = document.createElement('div');
  msg.className = 'message agent';
  msg.innerHTML = text;
  if (!group) {
    group = createMessageGroup();
  }
  group.appendChild(msg);
  requestAnimationFrame(() => {
    group.classList.add('visible');
    scrollToBottom();
  });
  return group;
}

function addUserMessage(text) {
  const group = createMessageGroup();
  const msg = document.createElement('div');
  msg.className = 'message user';
  msg.innerHTML = text;
  group.appendChild(msg);
  requestAnimationFrame(() => {
    group.classList.add('visible');
    scrollToBottom();
  });
}

function addOptions(items, autoSelectIndex) {
  return new Promise(resolve => {
    const container = document.createElement('div');
    container.className = 'options-container';

    items.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'option-card';
      card.innerHTML = `
        <div class="option-icon">${item.icon}</div>
        <div class="option-text">
          <div class="option-title">${item.title}</div>
          <div class="option-desc">${item.desc}</div>
        </div>
      `;
      card.addEventListener('click', () => {
        container.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
      });
      container.appendChild(card);
    });

    chatArea.appendChild(container);
    requestAnimationFrame(() => {
      container.classList.add('visible');
      scrollToBottom();
    });

    // Auto-select after a moment
    setTimeout(() => {
      const cards = container.querySelectorAll('.option-card');
      if (cards[autoSelectIndex]) {
        cards[autoSelectIndex].classList.add('selected');
        scrollToBottom();
      }
      resolve();
    }, 800);
  });
}

function addModeCards(items, autoSelectIndex) {
  return new Promise(resolve => {
    const container = document.createElement('div');
    container.className = 'mode-cards-container';

    items.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'mode-card' + (item.badge ? ' recommended' : '');
      card.innerHTML = `
        ${item.badge ? `<div class="mode-badge">${item.badge}</div>` : ''}
        <div class="mode-title">${item.title}</div>
        <div class="mode-subtitle">${item.subtitle}</div>
        <div class="mode-details">
          ${item.details.map(d => `<div class="mode-detail">${d}</div>`).join('')}
        </div>
      `;
      card.addEventListener('click', () => {
        container.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
      });
      container.appendChild(card);
    });

    chatArea.appendChild(container);
    requestAnimationFrame(() => {
      container.classList.add('visible');
      scrollToBottom();
    });

    setTimeout(() => {
      const cards = container.querySelectorAll('.mode-card');
      if (cards[autoSelectIndex]) {
        cards[autoSelectIndex].classList.add('selected');
        scrollToBottom();
      }
      resolve();
    }, 800);
  });
}

function addSlider(config) {
  return new Promise(resolve => {
    const container = document.createElement('div');
    container.className = 'slider-container';
    container.innerHTML = `
      <div class="slider-label">${config.label}</div>
      <div class="slider-value">${config.value}${config.unit}</div>
      <input type="range" class="slider-track" min="${config.min}" max="${config.max}" value="${config.value}">
      <div class="slider-range-labels">
        <span>${config.minLabel}</span>
        <span>${config.maxLabel}</span>
      </div>
    `;

    const slider = container.querySelector('.slider-track');
    const valueDisplay = container.querySelector('.slider-value');
    const pct = ((config.value - config.min) / (config.max - config.min)) * 100;
    slider.style.background = `linear-gradient(90deg, var(--primary) 0%, var(--primary) ${pct}%, var(--neutral-200) ${pct}%)`;

    slider.addEventListener('input', () => {
      const p = ((slider.value - config.min) / (config.max - config.min)) * 100;
      slider.style.background = `linear-gradient(90deg, var(--primary) 0%, var(--primary) ${p}%, var(--neutral-200) ${p}%)`;
      valueDisplay.textContent = slider.value + config.unit;
    });

    chatArea.appendChild(container);
    requestAnimationFrame(() => {
      container.classList.add('visible');
      scrollToBottom();
    });

    setTimeout(resolve, 500);
  });
}

function addAmount(config) {
  return new Promise(resolve => {
    const container = document.createElement('div');
    container.className = 'amount-container';
    container.innerHTML = `
      <div class="amount-input-wrap">
        <span class="currency-symbol">&euro;</span>
        <input type="text" class="amount-value" value="${config.value}" readonly>
      </div>
      <div class="amount-presets">
        ${config.presets.map((p, i) => `<button class="preset-btn${i === config.activePreset ? ' active' : ''}">&euro;${p}</button>`).join('')}
      </div>
    `;

    const presetBtns = container.querySelectorAll('.preset-btn');
    const amountInput = container.querySelector('.amount-value');
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        amountInput.value = btn.textContent.replace('€', '');
      });
    });

    chatArea.appendChild(container);
    requestAnimationFrame(() => {
      container.classList.add('visible');
      scrollToBottom();
    });

    setTimeout(resolve, 500);
  });
}

}

function addCTA(text, action) {
  return new Promise(resolve => {
    const btn = document.createElement('button');
    btn.className = 'cta-button';
    btn.textContent = text;

    btn.addEventListener('click', () => {
      if (action === 'connect-broker') {
        btn.textContent = 'Connessione in corso...';
        btn.style.opacity = '0.7';
        btn.style.pointerEvents = 'none';
        setTimeout(() => {
          btn.style.display = 'none';
          playNextBlock();
        }, 1500);
      } else if (action === 'go-dashboard') {
        document.getElementById('completionOverlay').classList.add('visible');
      }
    });

    chatArea.appendChild(btn);
    requestAnimationFrame(() => {
      btn.classList.add('visible');
      scrollToBottom();
    });

    setTimeout(resolve, 200);
  });
}

// ── Play a single block of actions ──
async function playBlock(block) {
  updateProgress(block.step, block.progress);

  let currentGroup = null;

  for (const action of block.actions) {
    if (action.delay) {
      await delay(action.delay);
    }

    switch (action.type) {
      case 'agent-msg':
        currentGroup = await addAgentMessage(action.text, currentGroup);
        break;
      case 'user-msg':
        currentGroup = null;
        addUserMessage(action.text);
        await delay(300);
        break;
      case 'options':
        currentGroup = null;
        await addOptions(action.items, action.autoSelect);
        break;
      case 'mode-cards':
        currentGroup = null;
        await addModeCards(action.items, action.autoSelect);
        break;
      case 'slider':
        currentGroup = null;
        await addSlider(action);
        break;
      case 'amount':
        currentGroup = null;
        await addAmount(action);
        break;
      case 'consent':
        currentGroup = null;
        await addConsent(action);
        break;
      case 'summary':
        currentGroup = null;
        await addSummary(action);
        break;
      case 'cta':
        currentGroup = null;
        await addCTA(action.text, action.action);
        return; // CTA blocks further auto-play (user clicks to continue)
    }
  }
}

// ── Play next block ──
async function playNextBlock() {
  if (currentScriptIndex >= conversationScript.length || isPlaying) return;
  isPlaying = true;

  const block = conversationScript[currentScriptIndex];
  currentScriptIndex++;

  await playBlock(block);

  isPlaying = false;

  // If next block starts with user-msg, update input field
  if (currentScriptIndex < conversationScript.length) {
    const next = conversationScript[currentScriptIndex];
    const firstAction = next.actions[0];
    if (firstAction.type === 'user-msg') {
      textInput.value = firstAction.text;
    } else {
      textInput.value = '';
      // Auto-continue non-user blocks after a pause
      await delay(1200);
      playNextBlock();
    }
  } else {
    textInput.value = '';
    sendBtn.classList.add('disabled');
  }
}

// ── Send Button Handler ──
sendBtn.addEventListener('click', async () => {
  if (isPlaying || !textInput.value.trim()) return;
  textInput.value = '';
  await playNextBlock();
});

// ── Enter key ──
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    sendBtn.click();
  }
});

// ── Init: auto-play the welcome on send ──
// The input is pre-filled, waiting for user to click send.
</script>
