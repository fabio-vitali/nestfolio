<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ebBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E7157B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C91068;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="8" ry="8" fill="url(#ebBg)" />
  <!-- Event bus: central bar with branching connections -->
  <!-- Central horizontal bus line -->
  <rect x="12" y="28" width="40" height="8" rx="4" ry="4" fill="white" opacity="0.9" />
  <!-- Top connections -->
  <circle cx="22" cy="16" r="5" fill="none" stroke="white" stroke-width="2" />
  <line x1="22" y1="21" x2="22" y2="28" stroke="white" stroke-width="2" />
  <circle cx="42" cy="16" r="5" fill="none" stroke="white" stroke-width="2" />
  <line x1="42" y1="21" x2="42" y2="28" stroke="white" stroke-width="2" />
  <!-- Bottom connections -->
  <circle cx="22" cy="48" r="5" fill="none" stroke="white" stroke-width="2" />
  <line x1="22" y1="36" x2="22" y2="43" stroke="white" stroke-width="2" />
  <circle cx="42" cy="48" r="5" fill="none" stroke="white" stroke-width="2" />
  <line x1="42" y1="36" x2="42" y2="43" stroke="white" stroke-width="2" />
  <!-- Small dots in circles to indicate events -->
  <circle cx="22" cy="16" r="2" fill="white" />
  <circle cx="42" cy="16" r="2" fill="white" />
  <circle cx="22" cy="48" r="2" fill="white" />
  <circle cx="42" cy="48" r="2" fill="white" />
</svg>
