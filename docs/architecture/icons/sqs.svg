<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sqsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4F8B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0407A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="8" ry="8" fill="url(#sqsBg)" />
  <!-- Queue: three messages stacked with arrow -->
  <rect x="14" y="16" width="24" height="8" rx="2" ry="2" fill="none" stroke="white" stroke-width="2" />
  <rect x="14" y="28" width="24" height="8" rx="2" ry="2" fill="none" stroke="white" stroke-width="2" />
  <rect x="14" y="40" width="24" height="8" rx="2" ry="2" fill="none" stroke="white" stroke-width="2" />
  <!-- Arrow pointing right -->
  <line x1="42" y1="32" x2="52" y2="32" stroke="white" stroke-width="2.5" />
  <polyline points="48,27 53,32 48,37" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
  <!-- Small lines inside message boxes -->
  <line x1="17" y1="20" x2="30" y2="20" stroke="white" stroke-width="1.5" opacity="0.7" />
  <line x1="17" y1="32" x2="30" y2="32" stroke="white" stroke-width="1.5" opacity="0.7" />
  <line x1="17" y1="44" x2="30" y2="44" stroke="white" stroke-width="1.5" opacity="0.7" />
</svg>
