type Query {
  getDecision(decisionId: ID!): DecisionPacket
  getPendingDecisions(limit: Int, cursor: String): DecisionConnection!
  getDecisionHistory(limit: Int, cursor: String): DecisionConnection!
  getAgentInvocations(decisionId: ID!): [AgentInvocation!]!
  getComplianceChecks(decisionId: ID!): [ComplianceCheck!]!
  getAdvisoryStatus: AdvisoryStatus
}

type Mutation {
  confirmDecision(decisionId: ID!): DecisionPacket!
  rejectDecision(decisionId: ID!, reason: String!): DecisionPacket!
  recordExplanationView(decisionId: ID!): ViewReceipt!
  publishDecisionUpdate(
    decisionId: ID!
    tenantId: ID!
    status: DecisionStatus!
    trigger: String!
    explanation: String!
    proposedTrades: [ProposedTradeInput!]!
    version: Int!
    createdAt: String!
    updatedAt: String!
    confirmationRequired: Boolean
    confirmedAt: String
    rejectedAt: String
    rejectionReason: String
  ): DecisionPacket! @aws_iam
  publishAdvisoryStatusUpdate(
    tenantId: ID!
    inFlightCount: Int!
    lastTriggerAt: String
    updatedAt: String!
  ): AdvisoryStatus! @aws_iam
}

type Subscription {
  # Return type MUST be nullable. AppSync resolves the subscription field on
  # subscription start (and on duplicate-subscribe coalescing when two clients
  # subscribe with identical args) using the implicit @aws_subscribe resolver,
  # which returns null prior to the first broadcast. A non-null modifier here
  # raises "Cannot return null for non-nullable type: 'DecisionPacket' within
  # parent 'Subscription' (/onDecisionUpdate)" — emitted as a graphql-ws
  # `error` frame that Apollo surfaces as next(data:null) + complete, killing
  # the live update path. Cf. dashboard-bff's Dashboard (also nullable).
  onDecisionUpdate(tenantId: ID!): DecisionPacket
  @aws_subscribe(mutations: ["confirmDecision", "rejectDecision", "publishDecisionUpdate"])
  @aws_cognito_user_pools
  @aws_iam
  onAdvisoryStatusUpdate(tenantId: ID!): AdvisoryStatus
    @aws_subscribe(mutations: ["publishAdvisoryStatusUpdate"])
    @aws_cognito_user_pools
    @aws_iam
}

enum DecisionStatus {
  PENDING
  DRAFT
  PROPOSED
  COMPLIANCE_REVIEW
  APPROVED
  BLOCKED
  CONFIRMATION_REQUIRED
  AWAITING_CONFIRMATION
  CONFIRMED
  REJECTED
  EXECUTING
  FILLED
  FAILED
}

enum ComplianceLevel {
  L1
  L2
  L3
}

enum ComplianceResult {
  PASSED
  FAILED
  ESCALATED
}

enum TradeSide {
  BUY
  SELL
}

type DecisionPacket @aws_cognito_user_pools @aws_iam {
  decisionId: ID!
  tenantId: ID!
  trigger: String!
  status: DecisionStatus!
  proposedTrades: [ProposedTrade!]!
  explanation: String!
  complianceChecks: [ComplianceCheck!]!
  agentInvocations: [AgentInvocation!]!
  confirmationRequired: Boolean!
  confirmedAt: String
  rejectedAt: String
  rejectionReason: String
  createdAt: String!
  updatedAt: String!
  version: Int!
}

type ProposedTrade @aws_cognito_user_pools @aws_iam {
  symbol: String!
  assetClass: String!
  side: TradeSide!
  quantityOrAmountCents: Int!
  targetWeightPercent: Float!
  rationale: String!
}

input ProposedTradeInput {
  symbol: String!
  assetClass: String!
  side: TradeSide!
  quantityOrAmountCents: Int!
  targetWeightPercent: Float!
  rationale: String!
}

type ComplianceCheck @aws_cognito_user_pools @aws_iam {
  checkId: ID!
  decisionId: ID!
  level: ComplianceLevel!
  ruleName: String!
  result: ComplianceResult!
  details: String
  checkedAt: String!
}

type AgentInvocation @aws_cognito_user_pools @aws_iam {
  invocationId: ID!
  decisionId: ID!
  agentName: String!
  modelId: String!
  inputTokens: Int!
  outputTokens: Int!
  latencyMs: Int!
  status: String!
  errorMessage: String
  startedAt: String!
  completedAt: String
}

type DecisionConnection {
  items: [DecisionPacket!]!
  nextCursor: String
}

type ViewReceipt {
  decisionId: ID!
  viewedAt: String!
}

type AdvisoryStatus @aws_cognito_user_pools @aws_iam {
  tenantId: ID!
  inFlightCount: Int!
  lastTriggerAt: String
  updatedAt: String!
}
