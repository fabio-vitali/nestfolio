type Query {
  getDashboard: Dashboard!
  getPositionSnapshots: [PositionSnapshot!]!
  getRecentActivity(limit: Int): [ActivityEntry!]!
  getTimeTravelAvailability: TimeTravelAvailability!
  getSimulationSummary: SimulationSummary
}

type Mutation {
  publishDashboardUpdate(
    tenantId: ID!
    advisoryStatus: AdvisoryStatusInput
  ): Dashboard!
    @aws_iam
  publishActivityUpdate(
    tenantId: ID!
    activity: ActivityEntryInput!
  ): ActivityBroadcast!
    @aws_iam
}

type Subscription {
  onDashboardUpdate(tenantId: ID!): Dashboard
    @aws_subscribe(mutations: ["publishDashboardUpdate"])
  onActivityUpdate(tenantId: ID!): ActivityBroadcast
    @aws_subscribe(mutations: ["publishActivityUpdate"])
}

input AdvisoryStatusInput {
  pendingDecisionsCount: Int!
  updatedAt: String!
}

# --- Types ---

type Dashboard @aws_cognito_user_pools @aws_iam {
  # Required by @aws_subscribe filter on onDashboardUpdate(tenantId).
  # AppSync compares subscription args against fields in the mutation response,
  # NOT the mutation's input args. Without this, the filter never matches and
  # the broadcast silently drops.
  tenantId: ID
  portfolioSummary: PortfolioSummary
  advisoryStatus: AdvisoryStatus
  investorSnapshot: InvestorSnapshot
}

type PortfolioSummary @aws_cognito_user_pools @aws_iam {
  totalValueCents: Int!
  cashBalanceCents: Int!
  positionCount: Int!
  updatedAt: String!
}

type PositionSnapshot @aws_cognito_user_pools @aws_iam {
  symbol: String!
  assetClass: String
  quantity: Float!
  avgCostBasisCents: Int!
  currentPriceCents: Int!
  marketValueCents: Int!
  weightPercent: Float!
  unrealizedPnlCents: Int!
  lastUpdatedAt: String!
}

type ActivityEntry @aws_cognito_user_pools @aws_iam {
  activityId: ID!
  activityType: String!
  description: String!
  createdAt: String!
  metadata: String
}

type AdvisoryStatus @aws_cognito_user_pools @aws_iam {
  pendingDecisionsCount: Int!
  updatedAt: String!
}

type InvestorSnapshot @aws_cognito_user_pools @aws_iam {
  goalType: String
  riskLevel: String
  operatingMode: String
  mandateLevel: String
  onboardedAt: String
  updatedAt: String!
}

type TimeTravelAvailability @aws_cognito_user_pools @aws_iam {
  available: Boolean!
  oldestDate: String
  latestDate: String
}

type SimulationSummary @aws_cognito_user_pools @aws_iam {
  actualTotalValueCents: Int!
  simulatedTotalValueCents: Int!
  actualReturnPercent: Float!
  simulatedReturnPercent: Float!
  returnDifferencePercent: Float!
  updatedAt: String!
}

input ActivityEntryInput {
  activityId: ID!
  activityType: String!
  description: String!
  createdAt: String!
  metadata: String
}

# @aws_subscribe filter pivot — tenantId MUST be in the mutation RESPONSE
# (not just the input args). Without this the broadcast silently drops.
type ActivityBroadcast @aws_cognito_user_pools @aws_iam {
  tenantId: ID
  activity: ActivityEntry!
}
