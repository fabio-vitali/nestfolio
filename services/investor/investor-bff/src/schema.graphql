type Query {
  getProfile: InvestorProfile!
  getNotifications(limit: Int, cursor: String): NotificationConnection!
  getUnreadCount: Int!
  getFeatureFlags: [FeatureFlag!]!
  getDeposit(depositId: ID!): Deposit!
}

type Mutation {
  updateGoal(input: GoalInput!): Goal!
  updateOperatingMode(mode: OperatingMode!): InvestorProfile!
  revokeMandate: Mandate!
  initiateDeposit(input: DepositInput!): Deposit!
  requestWithdrawal(input: WithdrawalInput!): WithdrawalRequest!
  requestAccountClosure: ClosureRequest!
  markNotificationRead(notificationId: ID!): Notification!
  updateFeatureFlag(name: String!, enabled: Boolean!, reason: String): FeatureFlag!
    @aws_iam
}

type Subscription {
  onNotification: Notification!
    @aws_subscribe(mutations: ["markNotificationRead"])
  onFeatureFlagUpdate: FeatureFlag
    @aws_subscribe(mutations: ["updateFeatureFlag"])
}

type FeatureFlag @aws_cognito_user_pools @aws_iam {
  name: String!
  enabled: Boolean!
  reason: String
}

# --- Enums ---

enum OperatingMode {
  CONSERVATIVE
  BALANCED
  AGGRESSIVE
}

enum MandateLevel {
  ADVISORY
  DISCRETIONARY
}

enum MandateStatusValue {
  ACTIVE
  REVOKED
}

enum RebalanceCadence {
  WEEKLY
  BI_WEEKLY
  MONTHLY
  QUARTERLY
}

enum NotificationChannel {
  PUSH
  EMAIL
  SMS
  IN_APP
}

enum NotificationStatus {
  CREATED
  SENT
  DELIVERED
  READ
}

# --- Types (composite shape) ---

type AccountMode {
  mode: String!
  capitalAmount: Int!
  currency: String!
}

type Goal {
  objective: String!
  targetAmountCents: Int!
  currency: String!
  timeHorizonMonths: Int!
  targetReturn: Float!
}

type RiskProfile {
  score: Int!
  band: RiskBand!
  toleranceResponse: String!
  experienceLevel: String!
}

type RiskBand {
  minEquity: Float!
  maxEquity: Float!
}

type Mandate {
  mandateId: ID!
  level: MandateLevel!
  status: MandateStatusValue!
  effectiveDate: String!
  revokedAt: String
}

type InvestorProfile {
  tenantId: ID!
  userId: String!
  email: String!
  operatingMode: OperatingMode!
  accountMode: AccountMode!
  goal: Goal!
  riskProfile: RiskProfile!
  mandate: Mandate!
  onboardingCompletedAt: String
  createdAt: String!
  updatedAt: String!
}

type Deposit @aws_cognito_user_pools {
  depositId: ID!
  amountCents: Int!
  currency: String!
  status: String!
  initiatedAt: String!
  detectedAt: String
  settledAt: String
  failedAt: String
  reason: String
}

type WithdrawalRequest {
  withdrawalId: ID!
  amountCents: Int!
  currency: String!
  status: String!
  requestedAt: String!
  settledAt: String
  failedAt: String
  reason: String
}

type ClosureRequest {
  closureId: ID!
  status: String!
  requestedAt: String!
}

type Notification {
  notificationId: ID!
  tenantId: ID!
  channel: NotificationChannel!
  title: String!
  body: String!
  status: NotificationStatus!
  relatedEntityType: String!
  relatedEntityId: String!
  createdAt: String!
  sentAt: String
  deliveredAt: String
  readAt: String
}

type NotificationConnection {
  items: [Notification!]!
  nextCursor: String
}

# --- Inputs ---

input GoalInput {
  objective: String
  targetAmountCents: Int
  currency: String
  timeHorizonMonths: Int
  targetReturn: Float
}

input DepositInput {
  depositId: ID!
  amountCents: Int!
  currency: String!
}

input WithdrawalInput {
  amountCents: Int!
  currency: String!
}
