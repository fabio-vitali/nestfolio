schema_version: 1
flow: advisory-cycle
description: Advisory decision cycle — Step Functions orchestrates 2 sequential agents (Portfolio Engine → Narrative). Investor-profile and market-intelligence outputs are precomputed snapshots — the SF reads them from DWC-local DDB projections via Direct DDB GetItem (no per-cycle agent invocation). PE + AN are the only waitForTaskToken hops; their CDC-emitted PORTFOLIO_COMPLETED/NARRATIVE_COMPLETED (and *_FAILED) events resume the SF via DWC's CallbackIngress. AssembleDecisionPacket reads agent outputs from SF state, runs compliance check, then optionally requests user confirmation before forwarding to execution and ledger.
domains: [advisory, investor, execution, ledger]

trigger: decision-workflow-ctrl receives one of 7 trigger events (MANDATE_SNAPSHOT_CREATED, INVESTOR_PROFILE_UPDATED, PORTFOLIO_DRIFT_DETECTED, ORDER_FILLED, ORDER_REJECTED, ORDER_CANCELLED, DEPOSIT_DETECTED); EventBridge starts the Step Functions execution directly via a native target (no Lambda hop). Pre-cycle snapshots (InvestorProfileSnapshot + MarketSnapshot) are continuously materialised in DWC-local DDB by SnapshotProjectorIngress so the SF can resolve them via Direct DDB GetItem without invoking IP/MI agents.

steps:
  # -- Phase 0: Cross-domain trigger ingestion --
  # 3 of the 7 triggers originate from the investor domain and arrive via advisory-adpt
  - cross_domain: INVESTOR_PROFILE_UPDATED | MANDATE_ISSUED | MANDATE_REVOKED
    from: InvestorBus
    to: AdvisoryBus
    via: advisory-adpt EB rule (AdvisoryIngress-FromInvestor)

  - cross_domain: ORDER_FILLED | ORDER_REJECTED | ORDER_CANCELLED | DEPOSIT_DETECTED | PORTFOLIO_DRIFT_DETECTED
    from: ExecutionBus
    to: AdvisoryBus
    via: advisory-adpt EB rule (AdvisoryIngress-FromExecution)

  # -- Phase 0a: First-decision projection (MandateSnapshot) --
  # MANDATE_ISSUED feeds the local mandate-projector → MandateSnapshot row →
  # CDC emits MANDATE_SNAPSHOT_CREATED (the canonical first-decision trigger).
  - service: decision-workflow-ctrl
    receives: MANDATE_ISSUED | OPERATING_MODE_CHANGED
    via: AdvisoryBus -> SQS -> MandateProjectorIngress (handlers/mandate-projector.ts)
    state_change: materializeToTable writes MandateSnapshot row with operatingMode + level + status='ACTIVE' (MANDATE_ISSUED → record; OPERATING_MODE_CHANGED → update operatingMode)
    emits: MANDATE_SNAPSHOT_CREATED (via Egress CDC on MandateSnapshot:INSERT only — operatingMode changes do NOT re-trigger the first decision)
    idempotent: true

  # -- Phase 0a-bis: InvestorProfileSnapshot continuous projection (pre-cycle) --
  # IP-ctrl subscribes to investor-domain mutations and continuously materialises
  # an InvestorProfileSnapshot row (one per (tenantId, userId)). CDC emits
  # INVESTOR_PROFILE_SNAPSHOT_CREATED / UPDATED on every change. DWC's
  # SnapshotProjectorIngress mirrors the snapshot into its own table so the SF
  # can resolve the IP agent output via Direct DDB GetItem — no per-cycle agent invocation.
  - service: investor-profile-ctrl
    receives: INVESTOR_PROFILE_UPDATED | MANDATE_ISSUED | OPERATING_MODE_CHANGED
    via: AdvisoryBus -> SQS -> investor-profile-ctrl-Ingress
    state_change: >
      LangGraph investor-profile agent (Haiku goals + Opus risk-assessment, parallel) runs once per
      input event against the Regulatory KB; materializeToTable writes the InvestorProfileSnapshot
      row carrying the full agent output (operatingMode + goalInterpretation + riskEvaluation).
      No AgentCore Memory write on the critical path; no SF callback (pre-cycle precomputation).
    emits: INVESTOR_PROFILE_SNAPSHOT_CREATED (CDC, InvestorProfileSnapshot:INSERT) | INVESTOR_PROFILE_SNAPSHOT_UPDATED (CDC, InvestorProfileSnapshot:MODIFY)
    idempotent: true

  - service: decision-workflow-ctrl
    receives: INVESTOR_PROFILE_SNAPSHOT_CREATED | INVESTOR_PROFILE_SNAPSHOT_UPDATED
    via: AdvisoryBus -> SQS -> SnapshotProjectorIngress (handlers/snapshot-projector.ts)
    state_change: >
      materializeToTable mirrors IP-ctrl's snapshot into DWC's own DDB table as the
      InvestorProfileSnapshot row (pk=`InvestorProfileSnapshot#{tenantId}#{userId}`,
      sk='InvestorProfileSnapshot'). The SF reads this via Direct DDB GetItem during
      the cycle. CREATED → record; UPDATED → update. Missing subject.agentOutput → NotRetryableError.
    emits: (none — local projection)
    idempotent: true

  # -- Phase 0a-ter: MarketSnapshot continuous projection (pre-cycle) --
  # MI-ctrl subscribes to 5 market-feed events plus a 15-minute MARKET_SNAPSHOT_REFRESH_TICK
  # schedule; each fast-tier feed write or slow-tier rebuild runs the agent and
  # materialises a MarketSnapshot row keyed by region. CDC emits MARKET_SNAPSHOT_UPDATED
  # (on both INSERT and MODIFY). DWC's SnapshotProjectorIngress mirrors it.
  - service: market-intelligence-ctrl
    receives: YAHOO_FINANCE_UPDATED | MARKETWATCH_UPDATED | SEC_8K_FILED | FRED_INDICATORS_UPDATED | ALPHA_VANTAGE_NEWS_UPDATED | MARKET_SNAPSHOT_REFRESH_TICK
    via: AdvisoryBus -> SQS -> market-intelligence-ctrl-Ingress
    state_change: >
      LangGraph market-intelligence agent (Sonnet) runs against the Market KB plus deterministic
      in-process context (market-data + instrument-universe pre-fetch); materializeToTable
      writes the MarketSnapshot row (one per region) carrying the agent output. Also writes
      legacy AgentInvocation row (emits MARKET_SIGNAL_DETECTED on insert only). Slow-tier tick
      (every 15 min) backstops idle feed periods; on stack Create a BootstrapSnapshotFn custom
      resource emits a synthetic tick and polls until the row materialises (5-min deadline).
    emits: MARKET_SNAPSHOT_UPDATED (CDC, MarketSnapshot:INSERT and MODIFY) | MARKET_SIGNAL_DETECTED (CDC, AgentInvocation:INSERT) | MARKET_INTELLIGENCE_AGENT_INVOCATION_TRACED (EventBridgeTraceEmitter)
    idempotent: true

  - service: decision-workflow-ctrl
    receives: MARKET_SNAPSHOT_UPDATED
    via: AdvisoryBus -> SQS -> SnapshotProjectorIngress (handlers/snapshot-projector.ts)
    state_change: >
      materializeToTable mirrors MI-ctrl's snapshot into DWC's own DDB table as the
      MarketSnapshot row (pk=`MarketSnapshot#{region}`, sk='MarketSnapshot'). The SF
      reads this via Direct DDB GetItem during the cycle. Missing subject.agentOutput → NotRetryableError.
    emits: (none — local projection)
    idempotent: true

  # -- Phase 1: Direct EB -> SF --
  - service: decision-workflow-ctrl
    receives: MANDATE_SNAPSHOT_CREATED | INVESTOR_PROFILE_UPDATED | PORTFOLIO_DRIFT_DETECTED | ORDER_FILLED | ORDER_REJECTED | ORDER_CANCELLED | DEPOSIT_DETECTED
    via: AdvisoryBus -> EB Rule -> SfnStateMachine target (Orchestration.triggers, direct)
    handler: Step Functions StartExecution (construct-managed, input = $.detail)
    state_change: >
      New DecisionStateMachine execution starts directly from the EventBridge target.
      The 7-event trigger list is wired declaratively on Orchestration.triggers.
      Entry Pass state (UnpackTriggerEnvelope) mints decisionId via States.UUID() and
      flattens {context.tenantId, context.userId, context.region, type, subject}
      to top-level SF state so every downstream putEvents task state can emit the
      event-processor envelope ({id, type, timestamp, subject, context}).
    emits: (none -- SF internal)
    idempotent: false  # duplicate trigger events start duplicate executions

  # -- Phase 2: Step Functions resolves snapshots + dispatches PE+AN tasks --
  # SF state machine definition: decision-state-machine.ts
  # Flow (post-precomputation):
  #   ParallelProjections (Branch A: InvestorProfile payload-first → snapshot fallback,
  #                        Branch B: LookupMarketSnapshot via Direct DDB GetItem)
  #   → MergeProjections
  #   → ResolveMandateSnapshot (payload-first → LookupMandateSnapshot via DDB GetItem)
  #   → PortfolioEngine (waitForTaskToken)
  #   → AdvisoryNarrative (waitForTaskToken)
  #   → AssembleDecisionPacket → Compliance → User-Confirm (L2)

  # Phase 2a: SF resolves InvestorProfile (Direct DDB GetItem on DWC-local InvestorProfileSnapshot)
  - service: decision-workflow-ctrl
    action: SF ParallelProjections Branch A — Choice (payload-first hoist when trigger carries an InvestorProfile body) else Direct DDB GetItem on InvestorProfileSnapshot (pk=`InvestorProfileSnapshot#{tenantId}#{userId}`, sk='InvestorProfileSnapshot'). No event emitted; no Lambda invoked.
    state_change: SF state Parameters carry investorProfile.agentOutput (operatingMode + goalInterpretation + riskEvaluation) for downstream PE + AN steps.

  # Phase 2b: SF resolves Market snapshot (Direct DDB GetItem on DWC-local MarketSnapshot)
  - service: decision-workflow-ctrl
    action: SF ParallelProjections Branch B — Direct DDB GetItem on MarketSnapshot (pk=`MarketSnapshot#{region}`, sk='MarketSnapshot'). No payload-first path (market signals are a global projection). No event emitted; no Lambda invoked.
    state_change: SF state Parameters carry marketSnapshot.agentOutput for downstream PE + AN steps.

  # Phase 2c: SF resolves MandateSnapshot (Direct DDB GetItem; payload-first when trigger carries operatingMode hint)
  - service: decision-workflow-ctrl
    action: SF ResolveMandateSnapshot — Choice (payload-first hoist when trigger carries operatingMode) else LookupMandateSnapshot via Direct DDB GetItem. No event emitted.
    state_change: SF state Parameters carry mandateSnapshot (operatingMode + level + status='ACTIVE').

  # Phase 2d: Sequential — Portfolio Construction Agent
  - service: decision-workflow-ctrl
    action: SF emits CONSTRUCT_PORTFOLIO via EventBridge putEvents.waitForTaskToken
    emits: CONSTRUCT_PORTFOLIO (SF EventBridge integration with taskToken)

  - service: portfolio-engine-ctrl
    receives: CONSTRUCT_PORTFOLIO
    via: AdvisoryBus -> SQS -> portfolio-engine-ctrl-Ingress
    state_change: >
      LangGraph portfolio-construction agent (Opus) runs against Fund KB; reads
      upstream agent outputs (operatingMode + investor-profile + market-analysis)
      directly from SF state Parameters (no AgentCore Memory roundtrip);
      materializeToTable writes AgentCompletion row on success (carries taskToken
      + agentOutput {allocations, trades, metadata}) or AgentFailure row on failure
      (carries taskToken + errorCode + cause). No states:SendTask* IAM grant on this service;
      the CDC event from the Egress is the sole bridge back to the SF.
    emits: PORTFOLIO_COMPLETED (CDC, AgentCompletion:INSERT) | PORTFOLIO_FAILED (CDC, AgentFailure:INSERT) | PORTFOLIO_CONSTRUCTION_PROPOSED (CDC, AgentInvocation:INSERT, legacy)
    idempotent: false

  - service: decision-workflow-ctrl
    receives: PORTFOLIO_COMPLETED | PORTFOLIO_FAILED
    via: AdvisoryBus -> SQS -> decision-workflow-ctrl-CallbackIngress
    handler: sfn-callback.ts (resumeStateMachine)
    state_change: >
      PORTFOLIO_COMPLETED: SendTaskSuccess resumes SF with agentOutput; sfn-callback also
      persists an AgentOutput record for the cycle.
      PORTFOLIO_FAILED: SendTaskFailure with errorCode + cause; SF state catches and
      the cycle ends as DECISION_WORKFLOW_FAILED.
    emits: AGENT_OUTPUT_CREATED | AGENT_OUTPUT_UPDATED (CDC, AgentOutput insert/modify, on success path)
    idempotent: true

  # Phase 2e: Sequential — Narrative Agent (after portfolio)
  - service: decision-workflow-ctrl
    action: SF emits GENERATE_NARRATIVE via EventBridge putEvents.waitForTaskToken
    emits: GENERATE_NARRATIVE (SF EventBridge integration with taskToken)

  - service: advisory-narrative-ctrl
    receives: GENERATE_NARRATIVE
    via: AdvisoryBus -> SQS -> advisory-narrative-ctrl-Ingress
    state_change: >
      LangGraph narrative agent (Haiku 4.5) runs against Explainability KB; reads
      upstream agent outputs from SF state Parameters; materializeToTable writes
      AgentCompletion row on success (carries taskToken + agentOutput carrying explanation)
      or AgentFailure row on failure. No states:SendTask* IAM grant on this service.
    emits: NARRATIVE_COMPLETED (CDC, AgentCompletion:INSERT) | NARRATIVE_FAILED (CDC, AgentFailure:INSERT) | EXPLANATION_GENERATED (CDC, ReasoningOutput:INSERT)
    idempotent: false

  - service: decision-workflow-ctrl
    receives: NARRATIVE_COMPLETED | NARRATIVE_FAILED
    via: AdvisoryBus -> SQS -> decision-workflow-ctrl-CallbackIngress
    handler: sfn-callback.ts (resumeStateMachine)
    state_change: >
      NARRATIVE_COMPLETED: SendTaskSuccess resumes SF with agentOutput (explanation);
      sfn-callback persists an AgentOutput record.
      NARRATIVE_FAILED: SendTaskFailure; SF state catches and the cycle ends as DECISION_WORKFLOW_FAILED.
    emits: AGENT_OUTPUT_CREATED | AGENT_OUTPUT_UPDATED (CDC, AgentOutput insert/modify, on success path)
    idempotent: true

  # -- Phase 3: Assemble Decision Packet --
  - service: decision-workflow-ctrl
    action: SF invokes AssemblePacket Lambda (lambda:invoke, synchronous — NOT waitForTaskToken)
    handler: handlers/assemble-packet.ts
    state_change: >
      Reads all 4 agent outputs from SF state Parameters — investor-profile + market
      from the precomputed snapshots resolved in Phase 2a/2b, portfolio + narrative
      from the waitForTaskToken callbacks. No AgentCore Memory reads. Builds
      proposedTrades from portfolio.allocations; extracts explanation from
      narrative.explainability.rationale (fallback summary). Writes DecisionPacket
      row with status='PENDING' via putIfNotExists (idempotent under SF retries).
    emits: DECISION_PACKET_CREATED (CDC, DecisionPacket:INSERT)
    idempotent: true

  # -- Phase 4: Wait for Compliance --
  - service: decision-workflow-ctrl
    action: SF emits RECOMMENDATION_PROPOSED with awaitingCompliance=true via EventBridge putEvents.waitForTaskToken; waits up to 24h for compliance result
    emits: RECOMMENDATION_PROPOSED (SF EventBridge integration with taskToken)

  - service: compliance-ctrl
    receives: RECOMMENDATION_PROPOSED
    via: AdvisoryBus -> SQS -> compliance-ctrl-Ingress
    handler: event-listener.ts (materializeToTable, processRecommendationProposed)
    state_change: >
      Loads GuardrailPolicy (MandateSnapshot) from DDB — projected ahead of time from MANDATE_ISSUED
      and OPERATING_MODE_CHANGED events (not from the InvestorProfile carrier). Runs
      MandateValidator -> GuardrailEvaluator -> SuitabilityChecker -> AuthorityResolver
      (mode-specific: maxSingleTradePercent, monthlyTurnoverCapPercent, singleEtfConcentrationPercent
      for L1/L2 resolution); writes ComplianceCheck + AuditArtifact records to DDB.
    emits: DECISION_APPROVED or DECISION_BLOCKED (CDC, field dispatch on ComplianceCheck.result — APPROVED->DECISION_APPROVED, BLOCKED->DECISION_BLOCKED), AUDIT_ARTIFACT (CDC, AuditArtifact:INSERT)
    idempotent: true

  # -- Phase 7: Compliance callback to SF --
  - service: decision-workflow-ctrl
    receives: DECISION_APPROVED | DECISION_BLOCKED
    via: AdvisoryBus -> SQS -> decision-workflow-ctrl-CallbackIngress
    handler: sfn-callback.ts (resumeStateMachine)
    state_change: >
      SendTaskSuccess resumes SF with {decision, authorityLevel}.
      If DECISION_APPROVED: updates DecisionPacket status to APPROVED (L1) or AWAITING_CONFIRMATION (L2).
      If DECISION_BLOCKED: updates DecisionPacket status to BLOCKED.
    emits: DECISION_PACKET_UPDATED (CDC, DecisionPacket:MODIFY auto-expand)
    idempotent: true

  # -- Phase 8: Compliance Choice (SF branching) --
  # ComplianceChoice in decision-state-machine.ts:
  #   $.complianceResult.decision == 'BLOCKED'        -> EndBlocked (terminate)
  #   $.complianceResult.decision == 'APPROVED' && authorityLevel == 'L1' -> EndApprovedL1 (auto-approve)
  #   otherwise (L2)                                   -> RequestUserConfirmation

  # Branch A: BLOCKED -> flow ends
  # Branch B: L1 APPROVED -> flow ends (autonomous approval)
  # Branch C: L2 APPROVED -> user confirmation required (continue to Phase 9)

  # -- Phase 9: Request User Confirmation (L2 path only) --
  - service: decision-workflow-ctrl
    action: SF emits USER_CONFIRMATION_REQUESTED via EventBridge putEvents.waitForTaskToken; waits up to 72h for user response
    emits: USER_CONFIRMATION_REQUESTED (SF EventBridge integration with taskToken)

  # -- Phase 9a: Cross-domain forwarding to investor for user confirmation --
  - cross_domain: USER_CONFIRMATION_REQUESTED
    from: AdvisoryBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromAdvisory)

  # -- Phase 0b: advisory-bff tracks in-flight decisions at trigger time --
  # Source: services/advisory/advisory-bff/src/transforms/decision-trigger-received.ts
  # advisory-bff subscribes to all 7 TRIGGER_EVENT_TYPES (same list as SF above).
  # On each trigger event: increments AdvisoryStatus.inFlightCount + sets lastTriggerAt.
  # On DECISION_PACKET_CREATED: decrements inFlightCount (decision has landed in the read model).
  # AdvisoryStatus changes are published via CDC → advisory-bff-egress → ADVISORY_STATUS_UPDATED,
  # which the event-publisher broadcasts via publishAdvisoryStatusUpdate IAM mutation so
  # the advisory MFE can subscribe onAdvisoryStatusUpdate and show a "N decisions in flight" badge
  # without polling. UI receives the counter update before the full DecisionPacket is assembled.
  - service: advisory-bff
    receives: MANDATE_SNAPSHOT_CREATED | INVESTOR_PROFILE_UPDATED | PORTFOLIO_DRIFT_DETECTED | ORDER_FILLED | ORDER_REJECTED | ORDER_CANCELLED | DEPOSIT_DETECTED
    via: AdvisoryBus -> SQS -> advisory-bff-Ingress
    handler: event-listener.ts (decisionTriggerReceived → decision-trigger-received.ts)
    state_change: Increments AdvisoryStatus.inFlightCount; sets lastTriggerAt; emits ADVISORY_STATUS_UPDATED via CDC
    emits: ADVISORY_STATUS_UPDATED (CDC, AdvisoryStatus insert/modify)
    idempotent: true

  # -- Phase 9b: BFF materialises for user-facing UI --
  - service: advisory-bff
    receives: USER_CONFIRMATION_REQUESTED | DECISION_PACKET_CREATED | DECISION_APPROVED | DECISION_BLOCKED | DECISION_PACKET_UPDATED
    via: AdvisoryBus -> SQS -> advisory-bff-Ingress
    handler: event-listener.ts (materializeToTable)
    state_change: >
      Materialises DecisionReadModel for GraphQL queries; user sees decision in UI.
      DECISION_PACKET_CREATED also decrements AdvisoryStatus.inFlightCount (counter closes at packet-creation time).
    emits: DECISION_READ_MODEL_CREATED | DECISION_READ_MODEL_UPDATED (CDC, DecisionReadModel insert/modify) | USER_INTERACTION_CREATED (CDC, UserInteraction insert) | ADVISORY_STATUS_UPDATED (CDC, AdvisoryStatus modify on DECISION_PACKET_CREATED)
    idempotent: true

  # -- Phase 10: User responds via advisory-bff mutations --
  - service: advisory-bff
    action: User calls confirmDecision or rejectDecision GraphQL mutation; BFF writes UserConfirmation or UserRejection record to DDB
    state_change: Writes UserConfirmation or UserRejection record
    emits: USER_CONFIRMED (CDC, UserConfirmation:INSERT) or USER_REJECTED (CDC, UserRejection:INSERT)

  # -- Phase 11: User response callback to SF --
  - service: decision-workflow-ctrl
    receives: USER_CONFIRMED | USER_REJECTED
    via: AdvisoryBus -> SQS -> decision-workflow-ctrl-CallbackIngress
    handler: sfn-callback.ts (resumeStateMachine)
    state_change: >
      SendTaskSuccess resumes SF with {decision}.
      If USER_CONFIRMED: updates DecisionPacket status to CONFIRMED.
      If USER_REJECTED: updates DecisionPacket status to REJECTED with rejectionReason.
    emits: DECISION_PACKET_UPDATED (CDC, DecisionPacket:MODIFY auto-expand)
    idempotent: true

  # -- Phase 12: Cross-domain forwarding --
  - cross_domain: DECISION_APPROVED
    from: AdvisoryBus
    to: ExecutionBus
    via: execution-adpt EB rule (ExecutionIngress-FromAdvisory)

  - cross_domain: DECISION_APPROVED
    from: AdvisoryBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromAdvisory)

  - cross_domain: DECISION_PACKET_CREATED
    from: AdvisoryBus
    to: LedgerBus
    via: ledger-adpt EB rule (LedgerIngress-FromAdvisory)

  - cross_domain: DECISION_PACKET_CREATED
    from: AdvisoryBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromAdvisory)

  - cross_domain: DECISION_BLOCKED
    from: AdvisoryBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromAdvisory)

  - cross_domain: EXPLANATION_GENERATED
    from: AdvisoryBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromAdvisory)

  # -- Phase 12b: Investor domain receives explanation for user-facing display --
  # EXPLANATION_GENERATED is forwarded to InvestorBus so the investor UI can surface
  # the human-readable explanation alongside the decision. No investor service currently
  # subscribes — the event is available on InvestorBus for future consumer wiring.
  # (dashboard-bff and investor-ctrl do not subscribe to EXPLANATION_GENERATED as of 2026-04-14)

  - cross_domain: USER_CONFIRMED
    from: AdvisoryBus
    to: ExecutionBus
    via: execution-adpt EB rule (ExecutionIngress-FromAdvisory)

success_criteria:
  - InvestorProfileSnapshot + MarketSnapshot projections exist in DWC-local DDB before the cycle begins (continuously materialised). Absent MarketSnapshot is tolerated — SF Catches the missing-Item failure and routes to HandleMissingMarketSnapshot (empty agentOutput default); PE+AN degrade gracefully.
  - SF resolves both snapshots via Direct DDB GetItem (no IP/MI agent invocation per cycle)
  - PE + AN agents return via materializeToTable AgentCompletion CDC within their windows; PORTFOLIO_COMPLETED / NARRATIVE_COMPLETED reach DWC's CallbackIngress and SendTaskSuccess resumes the SF
  - AssemblePacket writes a DecisionPacket row; CDC emits DECISION_PACKET_CREATED reaching advisory-bff (UI), ledger-adpt (audit), and investor-bff (decision history)
  - compliance-ctrl emits exactly one of DECISION_APPROVED / DECISION_BLOCKED
  - For L1 approved DecisionPacket.status='APPROVED' and DECISION_APPROVED reaches ExecutionBus
  - For L2 approved confirmDecision/rejectDecision mutation lands within 72h; USER_CONFIRMED causes DECISION_APPROVED propagation; USER_REJECTED ends the cycle with no execution

failure_modes:
  - trigger ingestion fails: EventBridge → SF native target invocation fails or is throttled; SF not started; trigger event sits on source-bus DLQ. No automatic retry of the cycle; manual replay.
  - InvestorProfileSnapshot missing at cycle start (IP-ctrl Ingress DLQ accumulating, or new tenant never went through onboarding): SF Branch A's Choice payload-first path is the safety net only when the trigger payload carries the IP body; otherwise the Direct DDB GetItem returns no row and SF state catches the error.
  - MarketSnapshot missing at cycle start (MI-ctrl Ingress DLQ, scheduler-broken, Bedrock outage, or fresh-deploy 15-min window): LookupMarketSnapshot's Catch handles States.Runtime (missing $.Item.agentOutput.M path) and States.TaskFailed by routing to HandleMissingMarketSnapshot, a Pass that seeds `{ agentOutput: {} }` on $.agentResults.InvokeMarketIntelligence. PE+AN read `subject.marketAnalysis ?? {}` so absent market context degrades the decision rather than aborting the cycle.
  - SnapshotProjectorIngress fails (DWC-local mirror falls behind IP/MI source rows): DWC's SF reads a stale snapshot until the SQS retry succeeds; missing subject.agentOutput → NotRetryableError so corrupt envelopes go straight to DLQ.
  - PE / AN agent invocation fails (Lambda exception, AgentCore degraded response): handler writes AgentFailure row → CDC emits PORTFOLIO_FAILED / NARRATIVE_FAILED → CallbackIngress calls SendTaskFailure → SF state catches and the cycle fails with DECISION_WORKFLOW_FAILED.
  - PE / AN agent stalls past waitForTaskToken window: SF TaskTimedOut fires; CDC-based completion event arriving after the timeout is logged and ignored. Manual replay; no auto-retry.
  - AssemblePacket fails: Lambda invocation error; SF state catches the error. Cycle ends without a DecisionPacket row. No retry.
  - compliance fails: compliance-ctrl Ingress DLQ; WaitForCompliance times out at 24h. Manual DLQ replay; SF can resume only if token is still valid (won't be after 24h).
  - compliance callback fails: CallbackIngress DLQ; SF stuck waiting; eventually times out at 24h. Manual replay (token-lag risk applies).
  - user confirmation cross-bus hop fails: investor-adpt FromAdvisoryDLQ accumulates; user never sees the request. SF will time out at 72h.
  - user callback fails: CallbackIngress DLQ; SF stuck waiting. Manual replay within the 72h window.
