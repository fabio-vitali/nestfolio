schema_version: 1
flow: advisory-cycle
description: Advisory decision cycle — Step Functions orchestrates 4 LangGraph agents (2 parallel + 2 sequential), assembles outputs via AgentCore Memory, runs compliance check, then optionally requests user confirmation before forwarding to execution
domains: [advisory, investor, execution]

trigger: decision-workflow-ctrl receives one of 7 trigger events; EventBridge starts the Step Functions execution directly via a native target.

steps:
  # -- Phase 0: Cross-domain trigger ingestion --
  # 4 of the 7 triggers originate from the investor domain and arrive via advisory-adpt
  - cross_domain: INVESTOR_PROFILE_CREATED | INVESTOR_PROFILE_UPDATED | MANDATE_ISSUED | MANDATE_REVOKED
    from: InvestorBus
    to: AdvisoryBus
    via: advisory-adpt EB rule (AdvisoryIngress-FromInvestor)

  - cross_domain: ORDER_FILLED | ORDER_REJECTED | ORDER_CANCELLED | DEPOSIT_DETECTED | PORTFOLIO_DRIFT_DETECTED
    from: ExecutionBus
    to: AdvisoryBus
    via: advisory-adpt EB rule (AdvisoryIngress-FromExecution)

  # -- Phase 1: Direct EB -> SF --
  - service: decision-workflow-ctrl
    receives: INVESTOR_PROFILE_CREATED | INVESTOR_PROFILE_UPDATED | PORTFOLIO_DRIFT_DETECTED | ORDER_FILLED | ORDER_REJECTED | ORDER_CANCELLED | DEPOSIT_DETECTED
    via: AdvisoryBus -> EB Rule -> SfnStateMachine target (Orchestration.triggers, direct)
    handler: Step Functions StartExecution (construct-managed, input = $.detail)
    state_change: >
      New DecisionStateMachine execution starts directly from the EventBridge target.
      The 7-event trigger list is wired declaratively on Orchestration.triggers.
      Entry Pass state (UnpackTriggerEnvelope) mints decisionId via States.UUID() and
      flattens {context.tenantId, context.userId, context.region, type, subject}
      to top-level SF state so every downstream putEvents task state can emit the
      event-processor envelope ({id, type, timestamp, subject, context}).
    emits: (none -- SF internal)
    idempotent: false  # duplicate trigger events start duplicate executions

  # -- Phase 2: Step Functions dispatches agent tasks --
  # SF state machine definition: decision-state-machine.ts
  # Flow: Parallel(InvestorProfile + MarketIntelligence) -> PortfolioEngine -> AdvisoryNarrative

  # Phase 2a: Parallel branch 1 — Investor Profile Agent
  - service: decision-workflow-ctrl
    action: SF emits ANALYZE_INVESTOR_PROFILE via EventBridge putEvents.waitForTaskToken
    emits: ANALYZE_INVESTOR_PROFILE (SF EventBridge integration with taskToken)

  - service: investor-profile-ctrl
    receives: ANALYZE_INVESTOR_PROFILE
    via: AdvisoryBus -> SQS -> investor-profile-ctrl-Ingress
    state_change: LangGraph agent (Opus model) analyzes investor profile using Regulatory KB; writes AgentInvocation and ReasoningOutput records; stores output to AgentCore Memory
    emits: GOAL_INTERPRETATION_PRODUCED (CDC, AgentInvocation:INSERT), RISK_EVALUATION_PRODUCED (CDC, ReasoningOutput:INSERT)
    idempotent: false
    note: Agent also emits INVESTOR_PROFILE_COMPLETED explicitly via event-publisher tool to resume SF

  # Phase 2b: Parallel branch 2 — Market Intelligence Agent
  - service: decision-workflow-ctrl
    action: SF emits ANALYZE_MARKET via EventBridge putEvents.waitForTaskToken (parallel with 2a)
    emits: ANALYZE_MARKET (SF EventBridge integration with taskToken)

  - service: market-intelligence-ctrl
    receives: ANALYZE_MARKET
    via: AdvisoryBus -> SQS -> market-intelligence-ctrl-Ingress
    state_change: LangGraph agent (Sonnet model) retrieves market data from Market KB (5 feed sources); writes AgentInvocation record; stores output to AgentCore Memory
    emits: MARKET_SIGNAL_DETECTED (CDC, AgentInvocation:INSERT)
    idempotent: false
    note: Agent also emits MARKET_ANALYSIS_COMPLETED explicitly via event-publisher tool to resume SF

  # Phase 2c: Sequential — Portfolio Construction Agent (after parallel merge)
  - service: decision-workflow-ctrl
    action: SF emits CONSTRUCT_PORTFOLIO via EventBridge putEvents.waitForTaskToken (after parallel branches complete)
    emits: CONSTRUCT_PORTFOLIO (SF EventBridge integration with taskToken)

  - service: portfolio-engine-ctrl
    receives: CONSTRUCT_PORTFOLIO
    via: AdvisoryBus -> SQS -> portfolio-engine-ctrl-Ingress
    state_change: LangGraph agent (Opus model) constructs optimal portfolio using Fund KB, portfolio-lookup tool; writes AgentInvocation and ReasoningOutput records; stores output to AgentCore Memory
    emits: PORTFOLIO_CONSTRUCTION_PROPOSED (CDC, AgentInvocation:INSERT), REBALANCE_PLAN_PRODUCED (CDC, ReasoningOutput:INSERT)
    idempotent: false
    note: Agent also emits PORTFOLIO_COMPLETED explicitly via event-publisher tool to resume SF

  # Phase 2d: Sequential — Narrative Agent (after portfolio)
  - service: decision-workflow-ctrl
    action: SF emits GENERATE_NARRATIVE via EventBridge putEvents.waitForTaskToken
    emits: GENERATE_NARRATIVE (SF EventBridge integration with taskToken)

  - service: advisory-narrative-ctrl
    receives: GENERATE_NARRATIVE
    via: AdvisoryBus -> SQS -> advisory-narrative-ctrl-Ingress
    state_change: LangGraph agent (Sonnet model) generates human-readable explanation using Explainability KB; writes ReasoningOutput record; stores output to AgentCore Memory
    emits: EXPLANATION_GENERATED (CDC, ReasoningOutput:INSERT)
    idempotent: false
    note: Agent also emits NARRATIVE_COMPLETED explicitly via event-publisher tool to resume SF

  # -- Phase 3: Agent completion callbacks --
  - service: decision-workflow-ctrl
    receives: INVESTOR_PROFILE_COMPLETED | MARKET_ANALYSIS_COMPLETED | PORTFOLIO_COMPLETED | NARRATIVE_COMPLETED
    via: AdvisoryBus -> SQS -> decision-workflow-ctrl-CallbackIngress
    handler: sfn-callback.ts (resumeStateMachine)
    state_change: SendTaskSuccess resumes SF; writes AgentOutput record to DDB per agent completion
    emits: AGENT_OUTPUT_CREATED (CDC, AgentOutput:INSERT auto-expand)
    idempotent: true

  # -- Phase 4: Assemble Decision Packet --
  - service: decision-workflow-ctrl
    action: SF invokes AssemblePacket Lambda (lambda:invoke, not waitForTaskToken)
    state_change: Reads all 4 agent outputs from AgentCore Memory (investor-profile, market-intelligence, portfolio-engine, advisory-narrative); returns assembled packet to SF state

  # -- Phase 5: Publish Recommendation --
  - service: decision-workflow-ctrl
    action: SF emits RECOMMENDATION_PROPOSED via EventBridge putEvents (fire-and-forget, NOT waitForTaskToken)
    emits: RECOMMENDATION_PROPOSED (SF EventBridge integration)

  # -- Phase 6: Wait for Compliance --
  - service: decision-workflow-ctrl
    action: SF emits RECOMMENDATION_PROPOSED with awaitingCompliance=true via EventBridge putEvents.waitForTaskToken; waits up to 24h for compliance result
    emits: RECOMMENDATION_PROPOSED (SF EventBridge integration with taskToken)

  - service: compliance-ctrl
    receives: RECOMMENDATION_PROPOSED
    via: AdvisoryBus -> SQS -> compliance-ctrl-Ingress
    handler: event-listener.ts (materializeToTable, processRecommendationProposed)
    state_change: >
      Loads GuardrailPolicy (MandateSnapshot) from DDB — projected ahead of time from MANDATE_ISSUED
      and OPERATING_MODE_CHANGED events (not from the InvestorProfile carrier). Runs
      MandateValidator -> GuardrailEvaluator -> SuitabilityChecker -> AuthorityResolver
      (mode-specific: maxSingleTradePercent, monthlyTurnoverCapPercent, singleEtfConcentrationPercent
      for L1/L2 resolution); writes ComplianceCheck + AuditArtifact records to DDB.
    emits: DECISION_APPROVED or DECISION_BLOCKED (CDC, field dispatch on ComplianceCheck.result — APPROVED->DECISION_APPROVED, BLOCKED->DECISION_BLOCKED), AUDIT_ARTIFACT (CDC, AuditArtifact:INSERT)
    idempotent: true

  # -- Phase 7: Compliance callback to SF --
  - service: decision-workflow-ctrl
    receives: DECISION_APPROVED | DECISION_BLOCKED
    via: AdvisoryBus -> SQS -> decision-workflow-ctrl-CallbackIngress
    handler: sfn-callback.ts (resumeStateMachine)
    state_change: >
      SendTaskSuccess resumes SF with {decision, authorityLevel}.
      If DECISION_APPROVED: updates DecisionPacket status to APPROVED (L1) or AWAITING_CONFIRMATION (L2).
      If DECISION_BLOCKED: updates DecisionPacket status to BLOCKED.
    emits: DECISION_PACKET_UPDATED (CDC, DecisionPacket:MODIFY auto-expand)
    idempotent: true

  # -- Phase 8: Compliance Choice (SF branching) --
  # ComplianceChoice in decision-state-machine.ts:
  #   $.complianceResult.decision == 'BLOCKED'        -> EndBlocked (terminate)
  #   $.complianceResult.decision == 'APPROVED' && authorityLevel == 'L1' -> EndApprovedL1 (auto-approve)
  #   otherwise (L2)                                   -> RequestUserConfirmation

  # Branch A: BLOCKED -> flow ends
  # Branch B: L1 APPROVED -> flow ends (autonomous approval)
  # Branch C: L2 APPROVED -> user confirmation required (continue to Phase 9)

  # -- Phase 9: Request User Confirmation (L2 path only) --
  - service: decision-workflow-ctrl
    action: SF emits USER_CONFIRMATION_REQUESTED via EventBridge putEvents.waitForTaskToken; waits up to 72h for user response
    emits: USER_CONFIRMATION_REQUESTED (SF EventBridge integration with taskToken)

  # -- Phase 9a: Cross-domain forwarding to investor for user confirmation --
  - cross_domain: USER_CONFIRMATION_REQUESTED
    from: AdvisoryBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromAdvisory)

  # -- Phase 0b: advisory-bff tracks in-flight decisions at trigger time --
  # Source: services/advisory/advisory-bff/src/transforms/decision-trigger-received.ts
  # advisory-bff subscribes to all 7 TRIGGER_EVENT_TYPES (same list as SF above).
  # On each trigger event: increments AdvisoryStatus.inFlightCount + sets lastTriggerAt.
  # On DECISION_PACKET_CREATED: decrements inFlightCount (decision has landed in the read model).
  # AdvisoryStatus changes are published via CDC → advisory-bff-egress → ADVISORY_STATUS_UPDATED,
  # which the event-publisher broadcasts via publishAdvisoryStatusUpdate IAM mutation so
  # the advisory MFE can subscribe onAdvisoryStatusUpdate and show a "N decisions in flight" badge
  # without polling. UI receives the counter update before the full DecisionPacket is assembled.
  - service: advisory-bff
    receives: INVESTOR_PROFILE_CREATED | INVESTOR_PROFILE_UPDATED | PORTFOLIO_DRIFT_DETECTED | ORDER_FILLED | ORDER_REJECTED | ORDER_CANCELLED | DEPOSIT_DETECTED
    via: AdvisoryBus -> SQS -> advisory-bff-Ingress
    handler: event-listener.ts (decisionTriggerReceived → decision-trigger-received.ts)
    state_change: Increments AdvisoryStatus.inFlightCount; sets lastTriggerAt; emits ADVISORY_STATUS_UPDATED via CDC
    emits: ADVISORY_STATUS_UPDATED (CDC, AdvisoryStatus insert/modify)
    idempotent: true

  # -- Phase 9b: BFF materialises for user-facing UI --
  - service: advisory-bff
    receives: USER_CONFIRMATION_REQUESTED | DECISION_PACKET_CREATED | DECISION_APPROVED | DECISION_BLOCKED | DECISION_PACKET_UPDATED
    via: AdvisoryBus -> SQS -> advisory-bff-Ingress
    handler: event-listener.ts (materializeToTable)
    state_change: >
      Materialises DecisionReadModel for GraphQL queries; user sees decision in UI.
      DECISION_PACKET_CREATED also decrements AdvisoryStatus.inFlightCount (counter closes at packet-creation time).
    emits: DECISION_READ_MODEL_CREATED | DECISION_READ_MODEL_UPDATED (CDC, DecisionReadModel insert/modify) | USER_INTERACTION_CREATED (CDC, UserInteraction insert) | ADVISORY_STATUS_UPDATED (CDC, AdvisoryStatus modify on DECISION_PACKET_CREATED)
    idempotent: true

  # -- Phase 10: User responds via advisory-bff mutations --
  - service: advisory-bff
    action: User calls confirmDecision or rejectDecision GraphQL mutation; BFF writes UserConfirmation or UserRejection record to DDB
    state_change: Writes UserConfirmation or UserRejection record
    emits: USER_CONFIRMED (CDC, UserConfirmation:INSERT) or USER_REJECTED (CDC, UserRejection:INSERT)

  # -- Phase 11: User response callback to SF --
  - service: decision-workflow-ctrl
    receives: USER_CONFIRMED | USER_REJECTED
    via: AdvisoryBus -> SQS -> decision-workflow-ctrl-CallbackIngress
    handler: sfn-callback.ts (resumeStateMachine)
    state_change: >
      SendTaskSuccess resumes SF with {decision}.
      If USER_CONFIRMED: updates DecisionPacket status to CONFIRMED.
      If USER_REJECTED: updates DecisionPacket status to REJECTED with rejectionReason.
    emits: DECISION_PACKET_UPDATED (CDC, DecisionPacket:MODIFY auto-expand)
    idempotent: true

  # -- Phase 12: Cross-domain forwarding --
  - cross_domain: DECISION_APPROVED
    from: AdvisoryBus
    to: ExecutionBus
    via: execution-adpt EB rule (ExecutionIngress-FromAdvisory)

  - cross_domain: DECISION_APPROVED
    from: AdvisoryBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromAdvisory)

  - cross_domain: DECISION_PACKET_CREATED
    from: AdvisoryBus
    to: LedgerBus
    via: ledger-adpt EB rule (LedgerIngress-FromAdvisory)

  - cross_domain: DECISION_PACKET_CREATED
    from: AdvisoryBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromAdvisory)

  - cross_domain: DECISION_BLOCKED
    from: AdvisoryBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromAdvisory)

  - cross_domain: EXPLANATION_GENERATED
    from: AdvisoryBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromAdvisory)

  # -- Phase 12b: Investor domain receives explanation for user-facing display --
  # EXPLANATION_GENERATED is forwarded to InvestorBus so the investor UI can surface
  # the human-readable explanation alongside the decision. No investor service currently
  # subscribes — the event is available on InvestorBus for future consumer wiring.
  # (dashboard-bff and investor-ctrl do not subscribe to EXPLANATION_GENERATED as of 2026-04-14)

  - cross_domain: USER_CONFIRMED
    from: AdvisoryBus
    to: ExecutionBus
    via: execution-adpt EB rule (ExecutionIngress-FromAdvisory)

success_criteria:
  - All 4 agent tasks complete and agent outputs stored to AgentCore Memory
  - AssemblePacket Lambda successfully reads all 4 outputs from Memory
  - RECOMMENDATION_PROPOSED emitted and compliance check runs
  - Compliance check produces DECISION_APPROVED (L1 auto-approve) or routes to user confirmation (L2)
  - For L2 path: USER_CONFIRMATION_REQUESTED reaches investor domain; user confirms via advisory-bff
  - DECISION_APPROVED reaches execution domain via execution-adpt for order execution

failure_modes:
  - step 1 (trigger ingestion) fails: EventBridge → SF native target invocation fails or is throttled; SF not started; trigger event sits on the source bus DLQ if a downstream rule failure cascades back
  - step 2a/2b (parallel agents) fails: Agent Lambda fails or times out (10min default); SF task token expires; branch fails
  - step 2c (portfolio engine) fails: SF task token timeout; PortfolioEngine branch fails
  - step 2d (narrative agent) fails: SF task token timeout; AdvisoryNarrative branch fails
  - step 3 (agent callbacks) fails: CallbackIngress DLQ; SF stuck waiting; eventually times out (72h SF timeout)
  - step 4 (assemble packet) fails: Lambda invocation fails; SF catches error
  - step 6 (compliance) fails: compliance-ctrl Ingress DLQ; WaitForCompliance times out (24h)
  - step 7 (compliance callback) fails: CallbackIngress DLQ; SF stuck waiting
  - step 9 (user confirmation) fails: USER_CONFIRMATION_REQUESTED not forwarded (investor-adpt FromAdvisoryDLQ); user never sees request; SF times out (72h)
  - step 11 (user callback) fails: CallbackIngress DLQ; SF stuck waiting
