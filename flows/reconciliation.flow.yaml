schema_version: 1
flow: reconciliation
description: >-
  reconciliation-ctrl compares intent positions against settlement positions per instrument,
  producing DriftRecord items for mismatches and a ReconciliationResult summary.
  CDC emits RECONCILIATION_COMPLETED and PORTFOLIO_DRIFT_DETECTED, which cross domains
  to update the investor dashboard and trigger the advisory rebalance cycle.
domains: [ledger, investor, advisory, execution]

trigger: >-
  Any of four events arriving on LedgerBus: PORTFOLIO_UPDATED (CDC from ledger-ctrl PortfolioEvent:INSERT),
  PORTFOLIO_SNAPSHOT_IMPORTED (execution cross-domain, pulled by ledger-adpt from ExecutionBus),
  CORPORATE_ACTION_APPLIED (execution cross-domain, pulled by ledger-adpt from ExecutionBus),
  ALPACA_ACCOUNT_SNAPSHOT (CDC from broker-alpaca-adpt AlpacaAccountSnapshot:INSERT, pulled by ledger-adpt from ExecutionBus).
  Each event only CACHES its side (Intent for the first three, Settlement for ALPACA_ACCOUNT_SNAPSHOT);
  reconciliation actually fires only when both the Intent and Settlement caches are present and fresh (<24h) —
  not on any single event in isolation.

steps:
  # --- Source events arrive on LedgerBus ---

  # PORTFOLIO_UPDATED is emitted by ledger-ctrl CDC (PortfolioEvent:INSERT) directly on LedgerBus.
  # No cross-domain hop needed — both ledger-ctrl and reconciliation-ctrl share the same bus.

  # Three execution-domain events are pulled into LedgerBus by ledger-adpt:
  - cross_domain: PORTFOLIO_SNAPSHOT_IMPORTED
    from: ExecutionBus
    to: LedgerBus
    via: ledger-adpt EB rule (LedgerIngress-FromExecution)

  - cross_domain: CORPORATE_ACTION_APPLIED
    from: ExecutionBus
    to: LedgerBus
    via: ledger-adpt EB rule (LedgerIngress-FromExecution)

  - cross_domain: ALPACA_ACCOUNT_SNAPSHOT
    from: ExecutionBus
    to: LedgerBus
    via: ledger-adpt EB rule (LedgerIngress-FromExecution)

  # --- reconciliation-ctrl processes trigger events ---

  - service: reconciliation-ctrl
    receives: PORTFOLIO_UPDATED | PORTFOLIO_SNAPSHOT_IMPORTED | CORPORATE_ACTION_APPLIED
    via: LedgerBus -> SQS -> reconciliation-ctrl-ingress
    handler: createHandlers factory map — PORTFOLIO_UPDATED handler (event-listener.ts)
    action: >-
      Caches the event's positions as the INTENT side into a PositionCache#tenantId row (sk=Intent),
      then reads the SETTLEMENT side from DDB. If the other side is absent or stale (>24h), returns
      skip() — no reconciliation. Only when BOTH sides are fresh does it call
      ReconciliationService.reconcile(), computing drift (intentQty - settlementQty) per instrument;
      abs(drift) > 0.001 produces a DriftEntry. Status DRIFT_DETECTED if any drift, else COMPLETED.
      reconciliationId is content-derived (sha256 of canonicalized positions).
    state_change: >-
      On reconcile only: writes ReconciliationResult (pk=Reconciliation#tenantId#<contentHash>,
      sk=Reconciliation) with status and driftCount, plus one DriftRecord per mismatched instrument
      (sk=DriftRecord#instrument) with intentQty, settlementQty, and drift.
    idempotent: true

  - service: reconciliation-ctrl
    receives: ALPACA_ACCOUNT_SNAPSHOT
    via: LedgerBus -> SQS -> reconciliation-ctrl-ingress
    handler: createHandlers factory map — ALPACA_ACCOUNT_SNAPSHOT handler (event-listener.ts)
    action: >-
      Reads positions from Alpaca-format payload (qty field) and caches them as the SETTLEMENT side
      (sk=Settlement) — unlike the other three events, which cache the INTENT side. Then
      cache-and-compare: reconciles only if a fresh Intent side exists, else skip().
    state_change: >-
      On reconcile only: same ReconciliationResult + DriftRecord schema as the Intent-side path.
    idempotent: true

  # --- CDC emits events from DynamoDB Streams ---

  - service: reconciliation-ctrl
    action: CDC (Egress) processes DynamoDB Stream changes
    emits_on_insert:
      ReconciliationResult: RECONCILIATION_COMPLETED
      DriftRecord: PORTFOLIO_DRIFT_DETECTED
    emits_on_modify:
      ReconciliationResult: RECONCILIATION_RESULT_UPDATED
      DriftRecord: DRIFT_RECORD_UPDATED
    note: Events emitted to LedgerBus via declarative eventTypes on Egress construct

  # --- Cross-domain forwarding: RECONCILIATION_COMPLETED → Investor ---

  - cross_domain: RECONCILIATION_COMPLETED
    from: LedgerBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromLedger)
    dlq: FromLedgerDLQ (14-day retention)
    # Verified: RECONCILIATION_COMPLETED in InvestorIngestEventTypes and investor-adpt service.stack.ts detailType array

  - service: dashboard-bff
    receives: RECONCILIATION_COMPLETED
    via: InvestorBus -> SQS -> dashboard-bff-ingress
    handler: LedgerCrossDomainEventTypes.RECONCILIATION_COMPLETED handler (event-listener.ts)
    state_change: >-
      No-op. RECONCILIATION_COMPLETED is subscribed but the portfolioSummary transform explicitly
      skips it (only BALANCE_UPDATED / PORTFOLIO_UPDATED carry a ledger snapshot); guarded out before
      parseSubject so it does not poison-pill to the DLQ. No row written.
    idempotent: true

  # --- Cross-domain forwarding: PORTFOLIO_DRIFT_DETECTED → Advisory ---

  - cross_domain: PORTFOLIO_DRIFT_DETECTED
    from: LedgerBus
    to: AdvisoryBus
    via: advisory-adpt EB rule (AdvisoryIngress-FromLedger)
    dlq: FromLedgerDLQ (14-day retention)
    # Verified: LEDGER_PORTFOLIO_DRIFT_DETECTED (= 'PORTFOLIO_DRIFT_DETECTED') in AdvisoryIngestEventTypes
    # and advisory-adpt service.stack.ts AdvisoryIngress-FromLedger detailType array

  - service: decision-workflow-ctrl
    receives: PORTFOLIO_DRIFT_DETECTED
    via: AdvisoryBus -> EventBridge target -> Step Functions (direct EB -> SF)
    handler: DecisionStateMachine.StartExecution (Orchestration.triggers)
    action: >-
      PORTFOLIO_DRIFT_DETECTED is one of the 7 TRIGGER_EVENT_TYPES that start
      the decision Step Functions workflow directly from EventBridge. The SF
      runs the 4-agent pipeline + compliance check (see advisory-cycle.flow.yaml).
    state_change: SF execution starts; decisionId minted in UnpackTriggerEnvelope
    idempotent: each user/system action produces exactly one trigger event

success_criteria:
  - Intent and settlement positions compared for all instruments in the event payload
  - DriftRecord created per instrument where abs(drift) > 0.001
  - ReconciliationResult written with status COMPLETED or DRIFT_DETECTED and accurate driftCount
  - RECONCILIATION_COMPLETED reaches dashboard-bff (currently a no-op — subscribed but not projected)
  - PORTFOLIO_DRIFT_DETECTED reaches decision-workflow-ctrl and triggers a Step Functions execution (rebalance)

failure_modes:
  - step 4-5 fails: reconciliation-ctrl ingress DLQ; reconciliation not executed
  - step 6 fails: CDC not emitted; downstream domains not notified
  - step 7 fails: investor-adpt FromLedgerDLQ; dashboard not updated with reconciliation status
  - step 8 fails: dashboard-bff ingress DLQ; portfolio summary stale
  - step 9 fails: advisory-adpt FromLedgerDLQ; rebalance not triggered
  - step 10 fails: EventBridge → SF native target invocation fails or is throttled; decision cycle not started
