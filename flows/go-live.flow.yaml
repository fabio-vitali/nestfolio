schema_version: 1
flow: go-live
description: Investor transitions from simulation to live trading by completing Go Live wizard, switching execution mode from simulation to live
domains: [investor, execution]

# NOTE: confirmGoLive() + GoLiveConfirmed CDC mapping + the frontend go-live wizard all exist, but the
# onboarding AGENT runtime never reaches them: PHASE_ORDER (src/agent/state.ts) has no go-live phases,
# commit_phase only calls completeSession on mandate_consent, and flowType='go-live' is read nowhere in
# src/agent. GO_LIVE_CONFIRMED is therefore NOT emitted today (confirmGoLive has no runtime caller).
trigger: onboarding-bff WOULD emit GO_LIVE_CONFIRMED (CDC from GoLiveConfirmed:INSERT) — emission path NOT wired in agent

steps:
  # Phase 1: Onboarding agent completes go-live wizard
  - service: onboarding-bff
    action: "Investor completes Go Live wizard (flowType='go-live', phases review_risk -> review_goals -> review_mandate -> fund_account -> go_live_confirmation). NOTE: these phases exist only as zod schema (src/domain/schemas.ts); the agent graph (src/agent/state.ts PHASE_ORDER) does not run them."
    state_change: "confirmGoLive() (onboarding.repository.ts:121) WOULD TransactWrite OnboardingSession (status='completed', currentPhase='go_live_confirmation') + put GoLiveConfirmed CDC record — but confirmGoLive() has no runtime caller, so this state change does not occur today."
    emits: GO_LIVE_CONFIRMED (CDC from GoLiveConfirmed:INSERT)
    idempotent: true

  # Phase 2: investor-bff materializes execution mode change
  - service: investor-bff
    receives: GO_LIVE_CONFIRMED
    via: InvestorBus -> SQS -> investor-bff-Ingress
    state_change: event-listener calls profileRepo.setExecutionMode(reqCtx, 'simulation', 'live') which TransactWrites ExecutionModeChange record (__typename='ExecutionModeChange', fromMode='simulation', toMode='live') and updates InvestorProfile (executionMode='live')
    emits: EXECUTION_MODE_CHANGED (CDC from ExecutionModeChange:INSERT)
    idempotent: true

  # Phase 3: Cross-domain forwarding to execution
  - cross_domain: EXECUTION_MODE_CHANGED
    from: InvestorBus
    to: ExecutionBus
    via: execution-adpt EB rule (ExecutionIngress-FromInvestor)

  # Phase 4: broker-ctrl caches execution mode for future routing decisions
  - service: broker-ctrl
    receives: EXECUTION_MODE_CHANGED
    via: ExecutionBus -> SQS -> broker-ctrl-ModeIngress
    state_change: mode-listener records ExecutionMode (__typename='ExecutionMode', pk='ExecutionMode#{tenantId}', mode='live'); future deposit/withdrawal/order routing uses Alpaca adapters instead of simulators
    idempotent: true

success_criteria:
  - ExecutionMode record materialized in broker-ctrl with mode='live'
  - Future ORDER_SUBMITTED events routed to broker-alpaca-adpt instead of broker-sim-adpt
  - Future DEPOSIT_INITIATED events routed to ALPACA_TRANSFER_REQUESTED instead of SIM_DEPOSIT_INITIATED
  - Future WITHDRAWAL_REQUESTED events routed to ALPACA_TRANSFER_REQUESTED instead of SIM_WITHDRAWAL_REQUESTED

failure_modes:
  - step 1 fails: onboarding-bff CDC not emitted; go-live not triggered
  - step 2 fails: investor-bff Ingress DLQ; ExecutionModeChange not written, execution mode unchanged
  - step 3 fails: execution-adpt FromInvestorDLQ; EXECUTION_MODE_CHANGED not forwarded to ExecutionBus
  - step 4 fails: broker-ctrl ModeIngress DLQ; ExecutionMode not materialized, orders still route to simulator adapters
