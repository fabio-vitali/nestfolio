schema_version: 1
flow: order-ledger
description: Order fill events from execution domain are recorded as ledger entries, balance and portfolio snapshots are materialized and forwarded cross-domain
domains: [execution, ledger, investor, advisory]

trigger: broker-ctrl emits ORDER_FILLED (CDC from NormalizedEvent:INSERT)

steps:
  - cross_domain: ORDER_FILLED
    from: ExecutionBus
    to: LedgerBus
    via: ledger-adpt EB rule

  - service: ledger-ctrl
    receives: ORDER_FILLED
    via: LedgerBus -> SQS -> ledger-ctrl-ingress
    state_change: Records LedgerEntryEvent (trade journal entry), BalanceEvent (cash debit/credit), PortfolioEvent (position update); reducer materializes account snapshots
    emits: BALANCE_UPDATED, PORTFOLIO_UPDATED, LEDGER_ENTRY_RECORDED (CDC)
    idempotent: true

  # Also handles partial fills
  - service: ledger-ctrl
    receives: ORDER_PARTIALLY_FILLED
    via: LedgerBus -> SQS -> ledger-ctrl-ingress
    state_change: Records partial fill as LedgerEntryEvent and PortfolioEvent (partial position update)
    emits: PORTFOLIO_UPDATED, LEDGER_ENTRY_RECORDED (CDC)
    idempotent: true

  # Cross-domain forwarding of ledger events
  - cross_domain: BALANCE_UPDATED
    from: LedgerBus
    to: InvestorBus
    via: investor-adpt EB rule

  - cross_domain: PORTFOLIO_UPDATED
    from: LedgerBus
    to: AdvisoryBus
    via: advisory-adpt EB rule

  - cross_domain: LEDGER_ENTRY_RECORDED
    from: LedgerBus
    to: InvestorBus
    via: investor-adpt EB rule

  # Investor domain consumption
  - service: investor-ctrl
    receives: BALANCE_UPDATED
    via: InvestorBus -> SQS -> investor-ctrl-ingress
    state_change: Updates investor balance view
    emits: NOTIFICATION_CREATED (CDC)
    idempotent: true

  # Note: ORDER_FILLED is NOT forwarded to InvestorBus by execution-adpt (routes to LedgerBus + AdvisoryBus only)
  # investor-ctrl receives ORDER_REJECTED via InvestorBus for notification; ORDER_FILLED status is visible via BALANCE_UPDATED + PORTFOLIO_UPDATED
  # TODO: verify if investor-ctrl subscribes to ORDER_FILLED on InvestorBus via a separate forwarding rule not in execution-adpt

  # Dashboard read model
  - service: dashboard-bff
    receives: BALANCE_UPDATED | PORTFOLIO_UPDATED | LEDGER_ENTRY_RECORDED
    via: InvestorBus -> SQS -> dashboard-bff-ingress
    state_change: Updates portfolio dashboard read model
    idempotent: true

  # Reconciliation trigger
  - service: reconciliation-ctrl
    receives: PORTFOLIO_UPDATED
    via: LedgerBus -> SQS -> reconciliation-ctrl-ingress
    state_change: Triggers reconciliation check comparing intent vs settlement positions
    emits: RECONCILIATION_COMPLETED or PORTFOLIO_DRIFT_DETECTED (CDC)
    idempotent: true

success_criteria:
  - Trade recorded as LedgerEntryEvent with correct debit/credit
  - Balance and portfolio snapshots materialized by reducer
  - BALANCE_UPDATED reaches investor domain for dashboard update
  - PORTFOLIO_UPDATED reaches advisory domain for drift monitoring

failure_modes:
  - step 1 fails: execution-adpt ToLedgerDLQ; ledger not notified of fill
  - step 2 fails: ledger-ctrl ingress DLQ; trade not recorded
  - step 4-6 fails: ledger-adpt forwarding DLQs; downstream domains not notified
  - step 10 fails: reconciliation-ctrl ingress DLQ; drift not detected
