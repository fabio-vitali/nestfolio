schema_version: 1
flow: order-ledger
description: Order fill events from execution domain recorded as ledger entries, balance and portfolio snapshots materialized via event-sourced reducer, forwarded cross-domain to investor and advisory
domains: [execution, ledger, investor, advisory]

trigger: ORDER_FILLED (or ORDER_PARTIALLY_FILLED) emitted by execution domain on ExecutionBus

steps:
  # Cross-domain ingestion: execution events pulled into ledger
  - cross_domain: ORDER_FILLED
    from: ExecutionBus
    to: LedgerBus
    via: ledger-adpt EB rule (LedgerIngress-FromExecution)

  - cross_domain: ORDER_PARTIALLY_FILLED
    from: ExecutionBus
    to: LedgerBus
    via: ledger-adpt EB rule (LedgerIngress-FromExecution)

  - cross_domain: ORDER_REJECTED
    from: ExecutionBus
    to: LedgerBus
    via: ledger-adpt EB rule (LedgerIngress-FromExecution)

  - cross_domain: ORDER_CANCELLED
    from: ExecutionBus
    to: LedgerBus
    via: ledger-adpt EB rule (LedgerIngress-FromExecution)

  # ledger-ctrl ingestion handler records ledger entries
  - service: ledger-ctrl
    receives: ORDER_FILLED | ORDER_PARTIALLY_FILLED | ORDER_REJECTED | ORDER_CANCELLED
    via: LedgerBus -> SQS -> ledger-ctrl-ingress
    state_change: Normalizes the ORDER_FILLED subject (symbol/side from $.subject, quantity←filledQty, fillPrice←averageFillPrice, filledAt←ctx.timestamp; order-execution-money-path WS-4) into the canonical RecordFill payload and writes a LedgerEntry record (__typename LedgerEntry) to DDB with sequenceNo; for ORDER_FILLED with live executionMode also opens/closes tax lots via TaxLotManager from the typed subject
    emits: none (state change only; LedgerEntry:INSERT triggers reducer via DDB Stream)
    idempotent: true

  # Reducer materializes the AccountSnapshot from the LedgerEntry stream
  - service: ledger-ctrl
    action: ReducerFn (DDB Stream consumer, filtered on INSERT where __typename = LedgerEntry)
    state_change: Replays entries since last checkpoint via accountReducer (RecordFill updates positions + cashBalanceCents); saveSnapshot writes AccountSnapshot (Snapshot#latest) + AccountCheckpoint with optimistic version lock
    emits: none (AccountSnapshot INSERT/MODIFY triggers SnapshotPublisherFn via DDB Stream)
    idempotent: true

  # Snapshot publisher derives per-event rows from the AccountSnapshot stream
  - service: ledger-ctrl
    action: SnapshotPublisherFn (DDB Stream consumer, filtered on INSERT and MODIFY where __typename = AccountSnapshot)
    state_change: snapshotToEvents writes BalanceEvent (if cashBalanceCents changed), PortfolioEvent (if positions changed), LedgerEntryEvent (always), and TTL'd SnapshotHistory — as independent record() intents, not one transaction
    emits: BALANCE_UPDATED (CDC from BalanceEvent:INSERT), PORTFOLIO_UPDATED (CDC from PortfolioEvent:INSERT), LEDGER_ENTRY_RECORDED (CDC from LedgerEntryEvent:INSERT)
    idempotent: true

  # Cross-domain forwarding to investor
  - cross_domain: BALANCE_UPDATED
    from: LedgerBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromLedger)

  - cross_domain: PORTFOLIO_UPDATED
    from: LedgerBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromLedger)

  - cross_domain: LEDGER_ENTRY_RECORDED
    from: LedgerBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromLedger)

  # Cross-domain forwarding to advisory
  - cross_domain: PORTFOLIO_UPDATED
    from: LedgerBus
    to: AdvisoryBus
    via: advisory-adpt EB rule (AdvisoryIngress-FromLedger)

success_criteria:
  - Every ORDER_FILLED event produces a LedgerEntry, which triggers reducer to update AccountSnapshot
  - Balance changes emit BALANCE_UPDATED; position changes emit PORTFOLIO_UPDATED; all entries emit LEDGER_ENTRY_RECORDED
  - Investor domain receives BALANCE_UPDATED, PORTFOLIO_UPDATED, and LEDGER_ENTRY_RECORDED for portfolio display
  - Advisory domain receives PORTFOLIO_UPDATED for drift detection and rebalancing triggers

  # -- Failure path: LEDGER_PROCESSING_FAILED --
  # When the ledger-ctrl ingestion handler throws (e.g. unknown event type, repository error),
  # the event-processor createIngestionHandler emits LEDGER_PROCESSING_FAILED directly to LedgerBus
  # (direct EB putEvents, NOT CDC — no DDB record written).
  - service: ledger-ctrl
    action: Ingestion handler throws (unrecoverable error after SQS retries exhausted)
    emits: LEDGER_PROCESSING_FAILED (direct EB putEvents via event-processor errorEventType)
    note: SQS message also sent to ledger-ctrl-ingress DLQ after maxReceiveCount exceeded

  - cross_domain: LEDGER_PROCESSING_FAILED
    from: LedgerBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromLedger)
    note: No investor-domain consumer currently subscribes; event is available on InvestorBus for alerting/notification wiring

  # -- Failure path: LEDGER_SNAPSHOT_PUBLISHER_FAILED --
  # When the SnapshotPublisherFn deriveFromStream pipeline throws (after DDB-stream retries),
  # event-processor emits LEDGER_SNAPSHOT_PUBLISHER_FAILED directly to LedgerBus. Unlike
  # LEDGER_PROCESSING_FAILED, this event is NOT in the InvestorIngress-FromLedger rule, so it is
  # terminal on LedgerBus.
  - service: ledger-ctrl
    action: SnapshotPublisherFn throws (deriveFromStream error after DDB-stream retries exhausted)
    emits: LEDGER_SNAPSHOT_PUBLISHER_FAILED (direct EB putEvents via event-processor errorEventType)
    note: NOT forwarded by investor-adpt (absent from InvestorIngress-FromLedger) — currently terminal on LedgerBus

failure_modes:
  - Ingestion handler fails: LEDGER_PROCESSING_FAILED error event emitted to LedgerBus (direct EB); SQS retries + DLQ
  - Reducer snapshot conflict: optimistic concurrency on snapshot version; DDB Stream retries (bisectBatchOnError, 3 retries)
  - CDC Egress fails: DLQ on Egress Lambda; BalanceEvent/PortfolioEvent/LedgerEntryEvent records persist regardless
  - Cross-domain forwarding fails: adapter DLQs (FromExecutionDLQ on ledger-adpt, FromLedgerDLQ on investor-adpt and advisory-adpt) with 14-day retention
  - LEDGER_PROCESSING_FAILED forwarding fails: investor-adpt FromLedgerDLQ (14-day retention)
  - Snapshot publisher fails: LEDGER_SNAPSHOT_PUBLISHER_FAILED error event emitted to LedgerBus (direct EB); DDB Stream retries (bisectBatchOnError, 3 retries); event is terminal on LedgerBus (not forwarded cross-domain)
