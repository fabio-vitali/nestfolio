schema_version: 1
flow: incident-escalation
description: Compliance escalations and broker order escalations surface as investor notifications via cross-domain forwarding
domains: [advisory, execution, investor]

# ─────────────────────────────────────────────────────────────────────────────
# Two parallel trigger paths converge at investor-adpt:
#
#   Path B: compliance-ctrl compliance pipeline determines decision must be
#           escalated → publishes ESCALATION_TRIGGERED directly to AdvisoryBus
#
#   Path C: broker-ctrl Step Functions order-state-machine times out waiting
#           for adapter callback → writes NormalizedEvent (sk=ORDER_ESCALATED)
#           → CDC emits ORDER_ESCALATED on ExecutionBus
# ─────────────────────────────────────────────────────────────────────────────

trigger: compliance-ctrl emits ESCALATION_TRIGGERED (direct PutEvents to AdvisoryBus); broker-ctrl Step Functions writes NormalizedEvent record (sk=ORDER_ESCALATED) → CDC emits ORDER_ESCALATED on ExecutionBus

steps:
  # ─── Path B: ESCALATION_TRIGGERED ────────────────────────────────────────

  - service: compliance-ctrl
    receives: RECOMMENDATION_PROPOSED
    via: AdvisoryBus -> SQS -> compliance-ctrl-Ingress
    state_change: Evaluates suitability and guardrail rules against GuardrailPolicy (MandateSnapshot projected from MANDATE_ISSUED + OPERATING_MODE_CHANGED); if threshold breached, publishes ESCALATION_TRIGGERED directly to AdvisoryBus via event-listener/event-publisher Lambda
    emits: ESCALATION_TRIGGERED (direct PutEvents to AdvisoryBus; not in egress CDC config)
    idempotent: true

  - cross_domain: ESCALATION_TRIGGERED
    from: AdvisoryBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromAdvisory)

  # ─── Path C: ORDER_ESCALATED ─────────────────────────────────────────────

  - service: broker-ctrl
    action: Step Functions order-state-machine adapter-callback timeout branch fires
    via: broker-ctrl-OrderStateMachine (Step Functions) → DynamoDB PutItem (arn:aws:states:::dynamodb:putItem)
    state_change: Writes NormalizedEvent record (pk=NormalizedEvent#{tenantId}#{orderId}, sk=ORDER_ESCALATED#{timestamp}, failureReason="Adapter timeout — escalated")
    emits: ORDER_ESCALATED (CDC from NormalizedEvent INSERT, sk passthrough determines event type)
    idempotent: true

  - cross_domain: ORDER_ESCALATED
    from: ExecutionBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromExecution)

  # ─── Investor domain: convergence point ──────────────────────────────────
  # NOTE: investor-ctrl does NOT currently subscribe to INCIDENT_DETECTED,
  # INCIDENT_RESOLVED, ESCALATION_TRIGGERED, or ORDER_ESCALATED.
  # These events reach InvestorBus but have no downstream consumer — a known
  # coverage gap. investor-ctrl triggerIngress handles (post-resplit 2026-05-08):
  # ONBOARDING_COMPLETED, MANDATE_ISSUED, MANDATE_REVOKED, OPERATING_MODE_CHANGED,
  # GOAL_UPDATED, DEPOSIT_INITIATED, DECISION_APPROVED, ORDER_FILLED, BALANCE_UPDATED,
  # ORDER_REJECTED, DECISION_BLOCKED, WITHDRAWAL_COMPLETED, BROKER_CIRCUIT_OPEN,
  # BROKER_CIRCUIT_CLOSED, BROKER_HEAL_ESCALATED.

  - service: investor-ctrl
    receives: ESCALATION_TRIGGERED | ORDER_ESCALATED
    via: InvestorBus -> (no SQS subscription configured — events are forwarded but not consumed)
    state_change: none (gap — no Notification record created for these event types)
    emits: none
    idempotent: true
    note: MISSING SUBSCRIPTION — investor-ctrl does not handle these events; no notification is sent to the investor

success_criteria:
  - ESCALATION_TRIGGERED reaches InvestorBus via investor-adpt InvestorIngress-FromAdvisory rule
  - ORDER_ESCALATED NormalizedEvent written by Step Functions, CDC emits on ExecutionBus, forwarded to InvestorBus via investor-adpt InvestorIngress-FromExecution rule

failure_modes:
  - Path B fails: compliance-ctrl event-publisher Lambda IAM error — PutEvents denied; event never reaches AdvisoryBus
  - Path B cross-domain: investor-adpt InvestorIngress-FromAdvisory DLQ (FromAdvisoryDLQ, 14-day retention) receives message if InvestorBus target is throttled or unavailable
  - Path C fails: Step Functions DynamoDB PutItem fails — ORDER_ESCALATED NormalizedEvent not written; CDC never fires; event lost
  - Path C cross-domain: investor-adpt InvestorIngress-FromExecution DLQ (FromExecutionDLQ, 14-day retention) receives message if InvestorBus target is unavailable
  - All paths: events reach InvestorBus but investor-ctrl has no subscription — no downstream notification is created (known gap)
