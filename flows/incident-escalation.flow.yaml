schema_version: 1
flow: incident-escalation
description: Broker order escalations surface as investor notifications via cross-domain forwarding
domains: [execution, investor]

# ─────────────────────────────────────────────────────────────────────────────
# Escalation in Nestfolio is realized two ways; only the order-escalation path is
# an EVENT path (this flow):
#
#   Order escalation (this flow): broker-ctrl Step Functions order-state-machine
#       times out waiting for the adapter callback → writes a NormalizedEvent row
#       (sk=ORDER_ESCALATED) → CDC emits ORDER_ESCALATED on ExecutionBus →
#       investor-adpt forwards it to InvestorBus → investor-ctrl writes a
#       Notification. Wired end-to-end as of 2026-06-15
#       (incident-escalation-path-b-nonfunctional).
#
#   L1→L2 authority escalation (NOT an event — by design): the spec's "Compliance
#       Agent enforces L1-to-L2 escalation" is realized as STATE + control flow,
#       not a broadcast event. compliance-ctrl/src/rules/authority-resolver.ts
#       computes authorityLevel; the decision-workflow SF ComplianceChoice routes
#       L2 → RequestUserConfirmation (taskToken written to the DecisionPacket,
#       status=AWAITING_CONFIRMATION), resumed by USER_CONFIRMED. The old
#       ESCALATION_TRIGGERED / INCIDENT_DETECTED / INCIDENT_RESOLVED /
#       USER_CONFIRMATION_REQUESTED constants were dead (no producer) and were
#       removed 2026-06-15. Generic incident containment is realized
#       domain-specifically (broker circuit breaker → broker-circuit-breaker.flow,
#       reconciliation drift, this order-escalation path).
# ─────────────────────────────────────────────────────────────────────────────

trigger: broker-ctrl Step Functions order-state-machine times out → writes NormalizedEvent record (sk=ORDER_ESCALATED) → CDC emits ORDER_ESCALATED on ExecutionBus

steps:
  - service: broker-ctrl
    action: Step Functions order-state-machine adapter-callback timeout branch fires
    via: broker-ctrl-OrderStateMachine (Step Functions) HandleTimeout Parallel state — branch 1 DynamoDB UpdateItem (arn:aws:states:::dynamodb:updateItem) sets BrokerOrder.state='ESCALATED'; branch 2 DynamoDB PutItem (arn:aws:states:::dynamodb:putItem) writes the NormalizedEvent row
    state_change: Updates BrokerOrder row (sk=BrokerOrder, state='ESCALATED') and writes NormalizedEvent record (pk=NormalizedEvent#{tenantId}#{orderId}, sk=ORDER_ESCALATED#{$$.State.EnteredTime}, failureReason="Adapter timeout — escalated")
    emits: ORDER_ESCALATED (CDC from NormalizedEvent INSERT, sk passthrough determines event type)
    idempotent: true

  - cross_domain: ORDER_ESCALATED
    from: ExecutionBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromExecution)

  - service: investor-ctrl
    receives: ORDER_ESCALATED
    via: InvestorBus -> SQS -> investor-ctrl-TriggerIngress
    state_change: event-listener parses the subject (NormalizedOrderEventSchema) and writes a Notification record (pk=Notification#{tenantId}#{notificationId}, sk=Notification, type=ORDER_ESCALATED, relatedEntityType=ORDER, relatedEntityId=orderId, channel=email,push) via record('Notification') -> CDC emits NOTIFICATION_CREATED
    emits: NOTIFICATION_CREATED (CDC from Notification INSERT)
    idempotent: true

success_criteria:
  - ORDER_ESCALATED NormalizedEvent written by Step Functions, CDC emits on ExecutionBus, forwarded to InvestorBus via investor-adpt InvestorIngress-FromExecution rule
  - investor-ctrl TriggerIngress consumes ORDER_ESCALATED and writes a Notification row (type=ORDER_ESCALATED, relatedEntityType=ORDER) -> NOTIFICATION_CREATED -> the investor sees an "Order Needs Review" notification

failure_modes:
  - Step Functions DynamoDB PutItem fails — ORDER_ESCALATED NormalizedEvent not written; CDC never fires; event lost
  - cross-domain: investor-adpt InvestorIngress-FromExecution DLQ (FromExecutionDLQ, 14-day retention) receives the message if the InvestorBus target is unavailable
  - investor-ctrl Notification poison-pill: a malformed ORDER_ESCALATED subject (fails NormalizedOrderEventSchema) routes to the TriggerIngress DLQ rather than creating a Notification
