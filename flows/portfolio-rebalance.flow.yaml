schema_version: 1
flow: portfolio-rebalance
description: Portfolio drift detected by reconciliation-ctrl triggers advisory decision cycle which produces rebalance orders
domains: [ledger, advisory, execution]

trigger: reconciliation-ctrl emits PORTFOLIO_DRIFT_DETECTED (CDC from DriftRecord insert)

steps:
  # Step 1: Drift detection — reconciliation-ctrl writes DriftRecord to DDB
  # Source: services/ledger/reconciliation-ctrl/src/service.stack.ts (Egress eventTypes)
  # DriftRecord insert -> PORTFOLIO_DRIFT_DETECTED, modify -> DRIFT_RECORD_UPDATED
  - service: reconciliation-ctrl
    action: Reconciliation detects position drift exceeding threshold
    state_change: Writes DriftRecord to DDB (tenantId, instrument, intentQty, settlementQty, drift)
    emits: PORTFOLIO_DRIFT_DETECTED (CDC from DriftRecord insert)
    idempotent: true

  # Step 2a: Cross-domain hop — advisory-adpt pulls PORTFOLIO_DRIFT_DETECTED from LedgerBus
  # Source: services/advisory/advisory-adpt/src/service.stack.ts (AdvisoryIngress-FromLedger rule)
  # Note: LEDGER_PORTFOLIO_DRIFT_DETECTED maps to wire name 'PORTFOLIO_DRIFT_DETECTED'
  - cross_domain: PORTFOLIO_DRIFT_DETECTED
    from: LedgerBus
    to: AdvisoryBus
    via: advisory-adpt EB rule (AdvisoryIngress-FromLedger, DLQ FromLedgerDLQ 14d)

  # Step 2b: Cross-domain hop — investor-adpt also pulls PORTFOLIO_DRIFT_DETECTED from LedgerBus
  # Source: services/investor/investor-adpt/src/service.stack.ts (InvestorIngress-FromLedger rule)
  # This path feeds dashboard-bff (pendingDecisionsCount +1) and advisory-bff (inFlightCount +1).
  - cross_domain: PORTFOLIO_DRIFT_DETECTED
    from: LedgerBus
    to: InvestorBus
    via: investor-adpt EB rule (InvestorIngress-FromLedger, DLQ FromLedgerDLQ 14d)

  # Step 3: decision-workflow-ctrl SF starts directly from EB → SF
  # Source: services/advisory/decision-workflow-ctrl/src/service.stack.ts (Orchestration.triggers)
  # All TRIGGER_EVENT_TYPES (7) wired declaratively as native EB → SF targets.
  # SF entry state UnpackTriggerEnvelope mints decisionId via States.UUID() and unpacks
  # tenantId/userId/region from the EB envelope's context block.
  - service: decision-workflow-ctrl
    receives: PORTFOLIO_DRIFT_DETECTED
    via: AdvisoryBus → EventBridge target → Step Functions (direct EB → SF)
    state_change: SF execution starts; decisionId minted in UnpackTriggerEnvelope; no DDB write at trigger time
    emits: nothing at this step (DecisionPacket row written by AssemblePacket later in the SF)
    idempotent: each user/system action produces exactly one trigger event

  # Step 3b: advisory-bff and dashboard-bff update in-flight counters at trigger time
  # (concurrent with step 3 — both receive PORTFOLIO_DRIFT_DETECTED via their respective buses)
  # advisory-bff (AdvisoryBus): increments AdvisoryStatus.inFlightCount → ADVISORY_STATUS_UPDATED
  # dashboard-bff (InvestorBus, via step 2b): increments AdvisoryStatus.pendingDecisionsCount
  # Both counters decrement when the decision resolves (DECISION_PACKET_CREATED / DECISION_APPROVED / DECISION_BLOCKED).

  # Step 4: SF orchestration — Step Functions reads precomputed IP+MI snapshots, then runs
  #         the 2 per-cycle agents (PE+AN) + compliance + user-confirm
  # Source: services/advisory/decision-workflow-ctrl/src/constructs/decision-state-machine.ts
  # SF flow: UnpackTriggerEnvelope → ParallelProjections (LookupInvestorProfileSnapshot || LookupMarketSnapshot, DDB GetItem)
  #        → InvokePortfolioEngine → InvokeAdvisoryNarrative → AssembleDecisionPacket
  #        → WaitForCompliance → ComplianceChoice (BLOCKED | APPROVED+L1 | else → user confirm)
  # Only PE+AN are invoked per cycle (publish detailType to AdvisoryBus with waitForTaskToken);
  # IP+MI are read as precomputed snapshots via DDB GetItem (no per-cycle invocation).

  # Step 4a: Precomputed snapshots — the SF reads InvestorProfileSnapshot + MarketSnapshot
  # via DDB GetItem (no per-cycle agent invocation). Post advisory-cycle-agent-precomputation,
  # investor-profile-ctrl and market-intelligence-ctrl no longer participate per cycle: they
  # continuously project their snapshot rows from upstream events, and the SF (ParallelProjections)
  # reads the DWC-local mirror via LookupInvestorProfileSnapshot + LookupMarketSnapshot.
  # Source: decision-state-machine.ts:413 (LookupInvestorProfileSnapshot DDB GetItem)
  # Source: decision-state-machine.ts:498 (LookupMarketSnapshot DDB GetItem)

  # investor-profile-ctrl: continuously projects InvestorProfileSnapshot from INVESTOR_PROFILE_UPDATED
  # (also MANDATE_ISSUED, DECISION_APPROVED, DECISION_BLOCKED). NOT invoked per cycle.
  # Source: services/advisory/investor-profile-ctrl/src/service.stack.ts:40-46 (Ingress), :58-61 (Egress)
  - service: investor-profile-ctrl
    receives: INVESTOR_PROFILE_UPDATED
    via: AdvisoryBus → SQS → investor-profile-ctrl-ingress (continuous projection, NOT per-cycle)
    state_change: Runs user-goals (Haiku) + risk-assessment (Sonnet) agents; upserts InvestorProfileSnapshot row to DDB
    emits: INVESTOR_PROFILE_SNAPSHOT_CREATED (insert) / INVESTOR_PROFILE_SNAPSHOT_UPDATED (modify) (CDC from InvestorProfileSnapshot row)
    idempotent: false

  # market-intelligence-ctrl: continuously projects MarketSnapshot from 5 feed events + a 15-min tick.
  # NOT invoked per cycle. Source: services/advisory/market-intelligence-ctrl/src/service.stack.ts:46-52 (Ingress), :64-68 (Egress)
  - service: market-intelligence-ctrl
    receives: YAHOO_FINANCE_UPDATED, MARKETWATCH_UPDATED, SEC_8K_FILED, FRED_INDICATORS_UPDATED, ALPHA_VANTAGE_NEWS_UPDATED, MARKET_SNAPSHOT_REFRESH_TICK
    via: AdvisoryBus → SQS → market-intelligence-ctrl-ingress (continuous projection, NOT per-cycle)
    state_change: Runs market-research (Sonnet) agent; upserts MarketSnapshot row (one per region) to DDB
    emits: MARKET_SNAPSHOT_UPDATED (CDC from MarketSnapshot insert/modify)
    idempotent: false

  # Step 4b: Sequential — portfolio-engine-ctrl
  # Source: decision-state-machine.ts (InvokePortfolioEngine emits CONSTRUCT_PORTFOLIO)
  # Source: services/advisory/portfolio-engine-ctrl/src/service.stack.ts (Ingress: CONSTRUCT_PORTFOLIO)
  - service: portfolio-engine-ctrl
    receives: CONSTRUCT_PORTFOLIO
    via: AdvisoryBus → SQS → portfolio-engine-ctrl-ingress
    state_change: Runs portfolio-construction (Sonnet) + rebalance-planner (Nova Pro) agents; writes AgentCompletion (success) or AgentFailure (caught error) row to DDB
    emits: PORTFOLIO_COMPLETED (CDC from AgentCompletion insert) or PORTFOLIO_FAILED (CDC from AgentFailure insert) — resumes SF via DWC CallbackIngress → SendTaskSuccess/Failure
    idempotent: false

  # Step 4c: Sequential — advisory-narrative-ctrl
  # Source: decision-state-machine.ts (InvokeAdvisoryNarrative emits GENERATE_NARRATIVE)
  # Source: services/advisory/advisory-narrative-ctrl/src/service.stack.ts (Ingress: GENERATE_NARRATIVE)
  - service: advisory-narrative-ctrl
    receives: GENERATE_NARRATIVE
    via: AdvisoryBus → SQS → advisory-narrative-ctrl-ingress
    state_change: Runs explainability (Haiku) agent; writes ReasoningOutput + AgentCompletion (success) / AgentFailure (caught error) rows to DDB
    emits: EXPLANATION_GENERATED (CDC from ReasoningOutput insert), NARRATIVE_COMPLETED (CDC from AgentCompletion insert) / NARRATIVE_FAILED (CDC from AgentFailure insert) — resumes SF via DWC CallbackIngress → SendTaskSuccess/Failure
    idempotent: false

  # Step 5: AssemblePacket Lambda reads agent outputs from Memory, writes DecisionPacket to DDB
  # Source: decision-state-machine.ts (AssembleDecisionPacket state, Lambda invoke)
  # Source: decision-workflow-ctrl/src/service.stack.ts (Egress: DecisionPacket -> DECISION_PACKET)

  # Step 6: SF publishes RECOMMENDATION_PROPOSED, then WaitForCompliance (task token)
  # Source: decision-state-machine.ts (PublishRecommendation + WaitForCompliance)

  # Step 7: compliance-ctrl evaluates the recommendation
  # Source: services/advisory/compliance-ctrl/src/service.stack.ts:16 (Ingress: RECOMMENDATION_PROPOSED), :25-32 (Egress field-map on ComplianceCheck.result)
  # Source: services/advisory/compliance-ctrl/src/handlers/event-listener.ts:193 (processDecisionPacket)
  - service: compliance-ctrl
    receives: RECOMMENDATION_PROPOSED
    via: AdvisoryBus → SQS → compliance-ctrl-ingress
    state_change: Evaluates mandate, guardrails, suitability; writes ComplianceCheck + AuditArtifact to DDB
    emits: DECISION_APPROVED or DECISION_BLOCKED (CDC from ComplianceCheck insert, field-mapped on result); AuditArtifact written to DDB but NOT CDC-emitted
    idempotent: true

  # Step 8: Compliance result resumes SF via callback
  # SF ComplianceChoice: BLOCKED → EndBlocked, APPROVED L1 → EndApprovedL1, L2 → RequestUserConfirmation
  # Source: decision-state-machine.ts (ComplianceChoice)

  # Step 9: Cross-domain hop — execution-adpt pulls DECISION_APPROVED from AdvisoryBus
  # Source: services/execution/execution-adpt/src/service.stack.ts (ExecutionIngress-FromAdvisory rule)
  - cross_domain: DECISION_APPROVED
    from: AdvisoryBus
    to: ExecutionBus
    via: execution-adpt EB rule (ExecutionIngress-FromAdvisory, DLQ FromAdvisoryDLQ 14d)

  # Step 10: execution-ctrl creates rebalance orders
  # Source: services/execution/execution-ctrl/src/service.stack.ts (Ingress: DECISION_APPROVED)
  # Source: services/execution/execution-ctrl/src/handlers/event-listener.ts (processApprovedDecision)
  # Runs safety checks, then: market open → SUBMITTED, market closed → STAGED + StagedOrder
  - service: execution-ctrl
    receives: DECISION_APPROVED
    via: ExecutionBus → SQS → execution-ctrl-ingress
    state_change: Safety checks → writes Order (SUBMITTED|STAGED|REJECTED) + optional StagedOrder to DDB
    emits: ORDER_SUBMITTED or ORDER_STAGED or ORDER_REJECTED (CDC from Order insert, status-based mapping)
    idempotent: true

  # Staged orders are processed at US market open (cron 14:30 UTC MON-FRI)
  # Source: services/execution/execution-ctrl/src/service.stack.ts (MarketOpenSchedule → StagedOrderProcessor)

  # ORDER_SUBMITTED continues through order-execution.flow.yaml

success_criteria:
  - Drift quantified in DriftRecord by reconciliation-ctrl
  - Advisory decision cycle (PE + AN per-cycle agents; IP + MI precomputed snapshots) produces rebalance plan with proposed trades
  - Compliance-ctrl evaluates and approves decision packet
  - Rebalance orders created in execution-ctrl (SUBMITTED or STAGED)
  - Staged orders processed at next market open

failure_modes:
  - step 1 fails: reconciliation-ctrl ingress DLQ; drift remains undetected
  - step 2 fails: advisory-adpt FromLedgerDLQ (14d retention); advisory domain not notified
  - step 3 fails: EventBridge → SF native target invocation fails or is throttled; decision cycle not started; trigger event sits on the source bus DLQ if a downstream rule failure cascades back
  - step 4a (snapshot lookup) misses: InvestorProfileSnapshot/MarketSnapshot row absent; SF Choice routes to HandleMissing* (empty agentOutput default); PE+AN degrade the decision via `?? {}` rather than aborting the cycle (tolerated, not a failure)
  - step 4b fails: portfolio-engine-ctrl agent failure; SF task token expires
  - step 4c fails: advisory-narrative-ctrl agent failure; SF task token expires
  - step 7 fails: compliance-ctrl ingress DLQ; compliance evaluation not performed
  - step 8 fails: compliance callback fails; SF WaitForCompliance times out (72h SF timeout)
  - step 9 fails: execution-adpt FromAdvisoryDLQ (14d retention); execution not notified
  - step 10 fails: execution-ctrl ingress DLQ; rebalance orders not created
  - safety checks fail: Order written with status REJECTED; no broker submission
