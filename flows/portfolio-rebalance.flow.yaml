schema_version: 1
flow: portfolio-rebalance
description: Portfolio drift detected by reconciliation-ctrl triggers advisory decision cycle which produces rebalance orders
domains: [ledger, advisory, execution]

trigger: reconciliation-ctrl emits PORTFOLIO_DRIFT_DETECTED (CDC from DriftRecord:INSERT)

steps:
  - service: reconciliation-ctrl
    action: Reconciliation check detects position drift exceeding threshold
    state_change: Writes DriftRecord to DDB with instrument, intentQty, settlementQty, drift values
    emits: PORTFOLIO_DRIFT_DETECTED (CDC from DriftRecord:INSERT)
    idempotent: true

  - service: execution-adpt
    receives: PORTFOLIO_DRIFT_DETECTED
    via: ExecutionBus -> execution-adpt ToAdvisory rule
    forwards_to: AdvisoryBus
    emits: PORTFOLIO_DRIFT_DETECTED

  # Advisory decision cycle triggered by drift
  - service: decision-workflow-ctrl
    receives: PORTFOLIO_DRIFT_DETECTED
    via: AdvisoryBus -> SQS -> decision-workflow-ctrl-TriggerIngress
    state_change: Starts new SF execution for rebalance decision cycle (same as advisory-cycle flow)
    emits: DECISION_PACKET_CREATED (CDC)
    idempotent: true

  # Phase 2-8: Full advisory decision cycle runs (see advisory-cycle.flow.yaml)
  # Agents analyze drift, construct rebalance plan, compliance checks, user confirmation
  - service: portfolio-engine-ctrl
    receives: CONSTRUCT_PORTFOLIO
    via: AdvisoryBus -> SQS -> portfolio-engine-ctrl-ingress
    state_change: Constructs rebalance plan (buy/sell orders to correct drift); produces REBALANCE_PLAN_PRODUCED
    emits: PORTFOLIO_COMPLETED (explicit via event-publisher)
    idempotent: false

  # After advisory cycle completes with DECISION_APPROVED
  - service: advisory-adpt
    receives: DECISION_APPROVED
    via: AdvisoryBus -> advisory-adpt ToExecution rule
    forwards_to: ExecutionBus
    emits: DECISION_APPROVED

  - service: execution-ctrl
    receives: DECISION_APPROVED
    via: ExecutionBus -> SQS -> execution-ctrl-ingress
    state_change: Creates rebalance orders (buy/sell) from decision packet
    emits: ORDER_SUBMITTED or ORDER_STAGED (CDC)
    idempotent: true

  # Orders execute through order-execution flow (see order-execution.flow.yaml)

success_criteria:
  - Portfolio drift detected and quantified in DriftRecords
  - Advisory decision cycle produces rebalance plan
  - Rebalance orders created and executed
  - Post-execution, reconciliation confirms drift is resolved

failure_modes:
  - step 1 fails: reconciliation-ctrl ingress DLQ; drift not detected
  - step 2 fails: execution-adpt ToAdvisoryDLQ; advisory not notified of drift
  - step 3 fails: decision-workflow-ctrl TriggerIngress DLQ; rebalance cycle not started
  - step 4 fails: portfolio-engine-ctrl agent failure; SF task token times out
  - step 6 fails: execution-ctrl ingress DLQ; rebalance orders not created
