schema_version: 1
flow: investor-onboarding
description: New investor completes onboarding wizard; investor-bff materializes the composite InvestorProfile row + Mandate sibling row (sk='Mandate'); emits INVESTOR_PROFILE_CREATED (carrier) + MANDATE_ISSUED (lifecycle) + DEPOSIT_INITIATED (conditional); investor-ctrl sends welcome notification via MANDATE_ISSUED subscription; compliance-ctrl bootstraps GuardrailPolicy from MANDATE_ISSUED; initial advisory decision cycle triggered from INVESTOR_PROFILE_CREATED via advisory-adpt
domains: [investor, execution, advisory]

trigger: onboarding-bff emits ONBOARDING_COMPLETED (CDC from OnboardingCompleted:INSERT)

steps:
  # --- Phase 1: onboarding-bff writes OnboardingCompleted record ---
  - service: onboarding-bff
    action: User completes 7-phase onboarding wizard (CopilotKit + LangGraph agent)
    state_change: Writes OnboardingCompleted record to DDB (tenantId, userId, goal, riskTolerance, riskExperience, operatingMode, mandateAccepted, capitalAmount, accountMode)
    emits: ONBOARDING_COMPLETED (CDC from OnboardingCompleted:INSERT)
    idempotent: true

  # --- Phase 2a: investor-bff materializes the composite InvestorProfile row + Mandate sibling ---
  - service: investor-bff
    receives: ONBOARDING_COMPLETED
    via: InvestorBus -> SQS -> investor-bff-ingress
    state_change: >
      transactWrite creates 2-3 records atomically (3-tier fan-out from DDB Streams):
      1. InvestorProfile composite row (sk='InvestorProfile', PUT) -- single row holds
         goal, riskProfile, operatingMode, accountMode, executionMode='simulation',
         onboardingCompletedAt
      2. Mandate sibling row (sk='Mandate', PUT) -- level='ADVISORY', status='ISSUED',
         effectiveDate; sole lifecycle row mutated by revokeMandate()
      3. Deposit row (sk='Deposit#<id>', PUT, conditional only when capitalAmount > 0) --
         depositId, amountCents, currency
    emits: >
      CDC events from DDB Streams (declarative Egress):
      - INVESTOR_PROFILE_CREATED (InvestorProfile:INSERT, carrier) -- advisory-adpt + dashboard-bff subscribe
      - MANDATE_ISSUED (Mandate:INSERT, lifecycle) -- advisory-adpt + investor-ctrl + compliance-ctrl subscribe
      - DEPOSIT_INITIATED (Deposit:INSERT, conditional) -- investor-ctrl + execution-adpt subscribe
    idempotent: true

  # --- Phase 2b: investor-ctrl creates welcome notification ---
  - service: investor-ctrl
    receives: ONBOARDING_COMPLETED
    via: InvestorBus -> SQS -> investor-ctrl-TriggerIngress
    state_change: >
      Writes Notification record (title: "Welcome to Nestfolio",
      body: "Your account setup is complete. You can now start investing.",
      channel: email, status: DELIVERED)
    emits: NOTIFICATION_CREATED (CDC from Notification:INSERT)
    idempotent: true

  # --- Phase 3: investor-bff materializes notification for frontend ---
  - service: investor-bff
    receives: NOTIFICATION_CREATED
    via: InvestorBus -> SQS -> investor-bff-ingress
    state_change: Materializes notification record for frontend display
    emits: none
    idempotent: true

  # --- Phase 4: dashboard-bff updates investor snapshot ---
  - service: dashboard-bff
    receives: INVESTOR_PROFILE_CREATED
    via: InvestorBus -> SQS -> dashboard-bff-ingress
    state_change: Updates investor snapshot read model from the composite InvestorProfile payload (operatingMode, goal, riskProfile)
    emits: none
    idempotent: true

  # --- Phase 5 (conditional): deposit triggers execution domain ---
  # Only fires when capitalAmount > 0 in onboarding payload

  - service: investor-ctrl
    receives: DEPOSIT_INITIATED
    via: InvestorBus -> SQS -> investor-ctrl-TriggerIngress
    state_change: Writes "Deposit Received" notification
    emits: NOTIFICATION_CREATED (CDC from Notification:INSERT)
    idempotent: true

  - cross_domain: DEPOSIT_INITIATED
    from: InvestorBus
    to: ExecutionBus
    via: execution-adpt EB rule (ExecutionIngress-FromInvestor)

  - service: broker-ctrl
    receives: DEPOSIT_INITIATED
    via: ExecutionBus -> SQS -> broker-ctrl-DepositWithdrawalIngress
    state_change: Routes deposit to broker adapter for processing
    emits: broker-specific events (depends on broker adapter)
    idempotent: true

  # --- Phase 6: Cross-domain to advisory (initial decision cycle, direct EB -> SF) ---
  - cross_domain: INVESTOR_PROFILE_CREATED
    from: InvestorBus
    to: AdvisoryBus
    via: advisory-adpt EB rule (AdvisoryIngress-FromInvestor)

  - cross_domain: MANDATE_ISSUED
    from: InvestorBus
    to: AdvisoryBus
    via: advisory-adpt EB rule (AdvisoryIngress-FromInvestor)

  - service: decision-workflow-ctrl
    receives: INVESTOR_PROFILE_CREATED
    via: AdvisoryBus -> EventBridge target -> Step Functions (direct EB -> SF)
    state_change: SF.StartExecution starts the initial advisory decision cycle for the new investor
    emits: agent-pipeline events (DECISION_PACKET_CREATED downstream)
    idempotent: true

  # --- Phase 7 (separate trigger): GO_LIVE_CONFIRMED ---
  # Emitted by onboarding-bff when user confirms going live (GoLiveConfirmed:INSERT)
  # This is a separate user action AFTER onboarding completion

  - service: investor-bff
    receives: GO_LIVE_CONFIRMED
    via: InvestorBus -> SQS -> investor-bff-ingress
    state_change: Sets executionMode from 'simulation' to 'live' on the composite InvestorProfile row via InvestorProfileRepository.setExecutionMode()
    emits: ExecutionModeChange (CDC -- INVESTOR_PROFILE_UPDATED with executionMode field set)
    idempotent: true

success_criteria:
  - Composite InvestorProfile row + Mandate sibling row (sk='Mandate') persisted in investor-bff DDB table
  - Conditional Deposit row written when capitalAmount > 0
  - Welcome notification delivered via investor-ctrl -> investor-bff materialization
  - Dashboard snapshot updated from INVESTOR_PROFILE_CREATED composite payload
  - If capitalAmount > 0, deposit routed to execution domain via execution-adpt
  - INVESTOR_PROFILE_CREATED + MANDATE_ISSUED forwarded to advisory domain via advisory-adpt
  - decision-workflow-ctrl starts exactly ONE advisory SF execution per onboarding (direct EB -> SF on INVESTOR_PROFILE_CREATED)

failure_modes:
  - step 1 fails: Onboarding wizard incomplete; user can retry. No DDB write, no CDC
  - step 2a fails: investor-bff ingress DLQ captures ONBOARDING_COMPLETED; composite profile + Mandate sibling rows not created until replay
  - step 2b fails: investor-ctrl ingress DLQ captures ONBOARDING_COMPLETED; welcome notification delayed
  - step 3 fails: investor-bff ingress DLQ captures NOTIFICATION_CREATED; notification not visible in frontend
  - step 4 fails: dashboard-bff ingress DLQ captures INVESTOR_PROFILE_CREATED; dashboard stale until replay
  - step 5 fails (conditional): execution-adpt FromInvestorDLQ captures DEPOSIT_INITIATED; deposit not processed
  - step 6 fails: advisory-adpt FromInvestorDLQ captures INVESTOR_PROFILE_CREATED/MANDATE_ISSUED; initial advisory cycle not started until replay
