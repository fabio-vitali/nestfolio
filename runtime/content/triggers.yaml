# runtime/content/triggers.yaml — watch-engine cadence config (content ring, seam #2).
# Itself a stored knob ⇒ scope of the watch-config-valid check (law §13.2).
triggers:
  - on: commit
    contexts: [invariant, gate]
    cost_ceiling: cheap
  - on: merge
    contexts: [invariant, gate]
    cost_ceiling: cheap
  - on: schedule
    cron: "0 6 * * 1"          # weekly (Mon 06:00 UTC) — matches .github/workflows/runtime-audit.yml
    contexts: [audit]
    cost_ceiling: expensive     # was moderate — audit judgment checks are expensive, so moderate ran zero
  - on: epic-pre-done
    contexts: [audit, gate]
    cost_ceiling: expensive
  - on: manual
    contexts: [gate, audit, invariant]
    cost_ceiling: expensive
