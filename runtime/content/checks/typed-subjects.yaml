id: typed-subjects
property: >
  Event `subject` strings are built via producer-owned typed subject contracts (parseSubject seam) —
  no ad-hoc subject literals; drift gated against tools/typed-subject-exclusions.json.
kind: drift
evaluator:
  type: deterministic
  run: cmd:node tools/check-typed-subjects.mjs
cost_tier: cheap
# contexts: [gate] (NOT invariant) — the tool full-scans (does not honor RUNTIME_STAGED_PATHS) and there are
# 2 pre-existing subject-suffix violations in broker-ctrl (parked: broker-ctrl-sim-funding-subject-suffix-rename).
# As an invariant it would block EVERY commit; scoped to services/** it fires only on service-staged commits,
# matching legacy verify-structure.sh #8 (no new regression). Promote to [invariant, gate] once broker-ctrl is fixed.
contexts: [gate]
scope:
  paths:
    - "services/**/src/**/*.ts"
  exclusions: "tools/typed-subject-exclusions.json"
status: active
provenance:
  minted_by: runtime-check-migration-completion
  ratified: "2026-07-06"
