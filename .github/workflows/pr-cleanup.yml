name: PR Cleanup
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to clean up'
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.pull_request.number != '' || github.event.inputs.pr-number != ''
    environment: sandbox
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR number is numeric
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || github.event.inputs.pr-number }}"
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: PR number '$PR_NUMBER' is not numeric. Aborting."
            exit 1
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: echo "yes" | bash infrastructure/scripts/teardown.sh "sandbox-pr-${{ env.PR_NUMBER }}"
